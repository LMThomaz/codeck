/* ------------------------------------------------------------------ automação */
const ACTIONS = {
  approve: {icon: "⚡", label: "Aprovar automaticamente", short: "aprovar", verb: "aprovaria", done: "aprovações", cls: "a-approve",
            desc: "Vota “Aprovado” assim que a PR aparece. Nunca sobrescreve um voto seu."},
  archive: {icon: "🗄", label: "Arquivar", short: "arquivar", verb: "arquivaria", done: "arquivadas", cls: "a-archive",
            desc: "Tira da fila e ignora — bom para bots e PRs que não são com você."},
  notify:  {icon: "🔔", label: "Só me notificar", short: "notificar", verb: "notificaria", done: "avisos", cls: "a-notify",
            desc: "Aviso do macOS quando chegar, sem votar."},
};
const TEMPLATES = [
  {label: "Aprovar tudo de uma pessoa (menos produção)", rule: {action: "approve"}},
  {label: "Aprovar PRs para develop de qualquer pessoa", rule: {action: "approve", targets: ["develop"]}},
  {label: "Me avisar quando chegar PR para master", rule: {action: "notify", targets: ["master"]}},
  {label: "Arquivar PRs de bots / build service", rule: {action: "archive", creators: ["Build Service", "Project Collection"]}},
];
let ed = null, edIsNew = false, edSim = null, edSimTimer = null;

const blankRule = (over = {}) => ({id: "", name: "", enabled: true, action: "approve", orgs: [], creators: [], targets: [],
                                   repos: [], titleContains: "", requireBuild: false, ...JSON.parse(JSON.stringify(over))});
const uniq = arr => [...new Set(arr.filter(Boolean))];
const listText = arr => arr.map(x => `<b>${esc(x)}</b>`).join(" ou ");

function ruleSentence(r) {
  const prot = S.rules.protectedTargets;
  const who = r.creators.length ? listText(r.creators) : "<b>qualquer pessoa</b>";
  const where = r.targets.length ? listText(r.targets)
    : `<b>qualquer branch</b>${prot.length ? ` <span class="muted">(menos ${prot.map(esc).join(", ")})</span>` : ""}`;
  const orgs = r.orgs.length ? ` em ${listText(r.orgs)}` : "";
  const repos = r.repos.length ? `, no repositório ${listText(r.repos)}` : "";
  const title = r.titleContains ? `, com “<b>${esc(r.titleContains)}</b>” no título` : "";
  return `Quando ${who} abrir PR para ${where}${orgs}${repos}${title}`;
}

async function saveRules(rules, protectedTargets = S.rules.protectedTargets, msg = "Regras salvas — aplicando agora", deployRules = S.rules.deployRules) {
  await post("/api/rules", {settings: S.rules.settings, protectedTargets, rules, deployRules});
  toast(msg); await load(); setTimeout(load, 4000);
}
async function saveSettings(patch) {
  await post("/api/rules", {settings: {...S.rules.settings, ...patch}, protectedTargets: S.rules.protectedTargets, rules: S.rules.rules, deployRules: S.rules.deployRules});
  await load();
}

function ruleCard(r, i) {
  const a = ACTIONS[r.action], st = S.ruleStats?.[r.id], open = S.prs.filter(p => p.ruleId === r.id && !p.archived).length;
  const prot = r.targets.filter(isProtected);
  return `<div class="rule ${r.enabled ? "" : "off"}">
    <label class="switch" title="${r.enabled ? "Desativar" : "Ativar"} regra"><input type="checkbox" data-rtoggle="${esc(r.id)}" ${r.enabled ? "checked" : ""}></label>
    <div class="rbody" data-redit="${esc(r.id)}">
      <div class="rtop"><span class="prio" title="Prioridade">${i + 1}</span>${r.name ? `<span class="rname">${esc(r.name)}</span>` : ""}
        <span class="act ${a.cls}">${a.icon} ${a.label}${r.action === "approve" && r.requireBuild ? " · após build verde" : ""}</span>
        ${prot.length && r.action === "approve" ? `<span class="pill p-warn">🔒 aprova ${prot.map(esc).join(", ")}</span>` : ""}
        ${r.enabled ? "" : `<span class="pill p-neutral">desativada</span>`}</div>
      <div class="sentence">${ruleSentence(r)}</div>
      <div class="rstats">${st ? `${st.count} ${a.done} nos últimos 30 dias · última há ${fmtH(hoursSince(st.last))}` : (r.action === "notify" ? "avisos não entram no histórico" : "ainda não agiu")}
        ${open ? ` · <b>${open}</b> aberta(s) agora` : ""}</div>
    </div>
    <div class="ractions">
      <button class="ghost sm" data-rmove="${i}|-1" ${i ? "" : "disabled"} title="Aumentar prioridade">↑</button>
      <button class="ghost sm" data-rmove="${i}|1" ${i < S.rules.rules.length - 1 ? "" : "disabled"} title="Diminuir prioridade">↓</button>
      <button class="sm" data-redit="${esc(r.id)}">Editar</button>
      <details class="menu"><summary>⋯</summary><div class="items">
        <button data-rdup="${esc(r.id)}">Duplicar</button>
        <button data-rdel="${esc(r.id)}" style="color:var(--bad)">Excluir</button>
      </div></details>
    </div>
  </div>`;
}

/* ---------- regras de release / permissão */
const DACTIONS = {
  release: {approve: {icon: "⚡", label: "Aprovar automaticamente", desc: "Aprova a release assim que ela chega no estágio.", verb: "aprovaria"},
            notify: {icon: "🔔", label: "Só me notificar", desc: "Aviso do macOS quando a release chegar, sem aprovar.", verb: "notificaria"}},
  permission: {approve: {icon: "⚡", label: "Liberar automaticamente", desc: "Dá a permissão (Permit) e o run continua sozinho.", verb: "liberaria"},
               notify: {icon: "🔔", label: "Só me notificar", desc: "Aviso do macOS quando um pipeline travar pedindo permissão.", verb: "notificaria"}},
};
const DTEMPLATES = [
  {label: "Aprovar Prod quando eu já aprovei a PR de release", rule: {kind: "release", action: "approve", stages: ["Prod"], branches: ["master"], requirePrApproved: true}},
  {label: "Aprovar tudo que não é produção (Dev/Homolog)", rule: {kind: "release", action: "approve", stages: ["Dev"]}},
  {label: "Liberar permissões de grupos de variáveis", rule: {kind: "permission", action: "approve"}},
  {label: "Me avisar de release para produção", rule: {kind: "release", action: "notify", stages: ["Prod"]}},
];
let ded = null, dedIsNew = false, dedSim = null, dedSimTimer = null;
const blankDRule = (over = {}) => ({id: "", name: "", enabled: true, kind: "release", action: "approve", orgs: [], pipelines: [], stages: [],
                                    branches: [], resources: [], requirePrApproved: false, ...JSON.parse(JSON.stringify(over))});

function dRuleSentence(r) {
  const pipes = r.pipelines.length ? listText(r.pipelines) : "<b>qualquer pipeline</b>";
  const orgs = r.orgs.length ? ` em ${listText(r.orgs)}` : "";
  if (r.kind === "permission")
    return `Quando ${pipes} travar pedindo permissão para ${r.resources.length ? listText(r.resources) : "<b>qualquer recurso</b>"}${orgs}`;
  return `Quando a release de ${pipes} chegar no estágio ${r.stages.length ? listText(r.stages) : "<b>qualquer estágio</b>"}`
    + `${r.branches.length ? `, vinda de ${listText(r.branches)}` : ""}${orgs}${r.requirePrApproved ? ", <b>se você já aprovou a PR de origem</b>" : ""}`;
}

function dRuleCard(r, i) {
  const a = DACTIONS[r.kind][r.action], st = S.ruleStats?.[r.id], open = S.deploys.filter(d => d.ruleId === r.id).length;
  const all = S.rules.deployRules;
  const risky = r.kind === "release" && r.action === "approve" && !r.requirePrApproved && (!r.stages.length || r.stages.some(x => /prod/i.test(x)));
  return `<div class="rule ${r.enabled ? "" : "off"}">
    <label class="switch"><input type="checkbox" data-drtoggle="${esc(r.id)}" ${r.enabled ? "checked" : ""}></label>
    <div class="rbody" data-dredit="${esc(r.id)}">
      <div class="rtop"><span class="prio">${i + 1}</span>${r.name ? `<span class="rname">${esc(r.name)}</span>` : ""}
        <span class="act ${r.action === "approve" ? "a-approve" : "a-notify"}">${r.kind === "permission" ? "🔑" : "🚀"} ${a.label}</span>
        ${risky ? `<span class="pill p-warn">🔒 pode subir para produção</span>` : ""}${r.enabled ? "" : `<span class="pill p-neutral">desativada</span>`}</div>
      <div class="sentence">${dRuleSentence(r)}</div>
      <div class="rstats">${st ? `${st.count} vez(es) nos últimos 30 dias · última há ${fmtH(hoursSince(st.last))}` : (r.action === "notify" ? "avisos não entram no histórico" : "ainda não agiu")}
        ${open ? ` · <b>${open}</b> na fila agora` : ""}</div>
    </div>
    <div class="ractions">
      <button class="ghost sm" data-drmove="${i}|-1" ${i ? "" : "disabled"}>↑</button>
      <button class="ghost sm" data-drmove="${i}|1" ${i < all.length - 1 ? "" : "disabled"}>↓</button>
      <button class="sm" data-dredit="${esc(r.id)}">Editar</button>
      <details class="menu"><summary>⋯</summary><div class="items">
        <button data-drdup="${esc(r.id)}">Duplicar</button>
        <button data-drdel="${esc(r.id)}" style="color:var(--bad)">Excluir</button>
      </div></details>
    </div></div>`;
}

const saveDeployRules = (deployRules, msg) => saveRules(S.rules.rules, S.rules.protectedTargets, msg, deployRules);

function openDEditor(rule, isNew) { ded = blankDRule(rule); dedIsNew = isNew; dedSim = null; renderEditor(); runDSim(); }

function runDSim() {
  clearTimeout(dedSimTimer);
  dedSimTimer = setTimeout(async () => {
    const snap = JSON.stringify(ded);
    let res; try { res = await post("/api/simulate-deploy", {rule: ded}); } catch (e) { res = {error: e.message}; }
    if (!ded || JSON.stringify(ded) !== snap) return;
    dedSim = res; const box = $("#edsim"); if (box) box.innerHTML = dSimHtml();
  }, 250);
}

function dSimHtml() {
  if (!dedSim) return `<div class="muted small">Calculando…</div>`;
  if (dedSim.error) return `<div class="error">${esc(dedSim.error)}</div>`;
  const a = DACTIONS[ded.kind][ded.action], o = dedSim.open;
  return `<div class="simgrid">
      <div class="simstat"><div class="v">${o.length}</div><div class="l">de ${dedSim.openTotal} itens na fila agora</div></div>
      ${ded.kind === "release" ? `<div class="simstat"><div class="v">${dedSim.historyCount}</div><div class="l">estágios executados nas releases recentes<br><span class="muted">de ${dedSim.historyTotal}</span></div></div>`
        : `<div class="simstat"><div class="v">—</div><div class="l">permissões não têm histórico no Azure</div></div>`}
    </div>
    ${o.length ? `<div class="simlist">${o.map(d => `<div class="simrow"><div class="ell">${esc(d.pipeline)}${d.stage ? ` → <b>${esc(d.stage)}</b>` : ""}
        <div class="small muted">${esc(d.org)} · ${esc(d.branch || "")} ${esc(d.version || "")}${d.resources?.length ? ` · ${esc(d.resources.map(r => r.name).join(", "))}` : ""}</div></div>
        ${d.shadowedBy ? `<span class="pill p-warn">decide: ${esc(d.shadowedBy)}</span>` : `<span class="pill p-auto">${a.verb}</span>`}</div>`).join("")}</div>` : ""}
    ${ded.kind === "release" && dedSim.history.length ? `<div class="small muted" style="margin-top:8px">Recentes que teria pego: ${dedSim.history.slice(0, 5).map(h => `${esc(h.pipeline.replace(/ - deploy$/, ""))} → ${esc(h.stage)} (${esc(h.branch)})`).join(", ")}</div>` : ""}
    ${!o.length && !(dedSim.history || []).length ? `<div class="warnbox" style="margin-top:8px">Nada recente se encaixa — confira o nome do pipeline/estágio.</div>` : ""}`;
}

      <section><h4><span class="step">1</span>Quando aparecer</h4>

          <button type="button" class="actcard ${!rel ? "on" : ""}" data-dkind="permission"><span class="ai">🔑</span><span><b>Pipeline pedindo permissão</b><small>Run travado em “needs permission to access a resource” (grupo de variáveis, service connection…).</small></span></button>
        </div></section>
      <section><h4><span class="step">2</span>O que fazer</h4>
        <div class="acts">${Object.entries(DACTIONS[r.kind]).map(([k, a]) => `<button type="button" class="actcard ${r.action === k ? "on" : ""}" data-daction="${k}">
          <span class="ai">${a.icon}</span><span><b>${a.label}</b><small>${a.desc}</small></span></button>`).join("")}</div></section>
      <section><h4><span class="step">3</span>De qual pipeline</h4>

        <input class="addin" data-dadd="pipelines" placeholder="Parte do nome + Enter (“financeiro” pega minhaempresa-financeiro-api - deploy) — aceita curinga">

        ${r.action === "approve" ? `<label class="switch opt" style="border:0;padding-bottom:0"><input type="checkbox" data-dedf="requirePrApproved" ${r.requirePrApproved ? "checked" : ""}>
          <span>Só se eu já aprovei a PR de origem<small>Lê a PR do commit (“Merge pull request N…”) e confere o seu voto. Sem PR identificada, espera você.</small></span></label>` : ""}
        ${risky ? `<div class="warnbox">🔒 Esta regra pode aprovar <b>produção</b> sem você olhar. Ligue “Só se eu já aprovei a PR de origem” para manter o seu crivo na PR.</div>` : ""}
      </section>` : `<section><h4><span class="step">4</span>Para quais recursos</h4>
        <div class="chips">${chip("anyres", "", !r.resources.length, "Qualquer recurso")}${resAll.map(x => chip("resources", x, r.resources.includes(x))).join("")}</div>

        <p class="small muted" style="margin:8px 0 0">Só libera quando <b>todos</b> os recursos pedidos pelo run se encaixam.</p></section>`}
      <section><h4><span class="step">5</span>Em qual organização</h4>

function dedChange() { dedSim = null; renderEditor(); runDSim(); }

async function handleDeployRuleClick(t, d) {
  if (d.newdrule !== undefined) { openDEditor(blankDRule(), true); return true; }
  if (d.dtpl) { t.closest("details")?.removeAttribute("open"); openDEditor(blankDRule(DTEMPLATES[Number(d.dtpl)].rule), true); return true; }
  if (d.dredit) { if (e_isInteractive(t) && !t.matches("[data-dredit]")) return false; openDEditor(S.rules.deployRules.find(r => r.id === d.dredit), false); return true; }
  if (d.dmkrule) {
    t.closest("details")?.removeAttribute("open");
    const it = S.deploys.find(x => x.key === d.dmkrule);
    const pipe = it.pipeline.replace(/ - deploy$/, "");
    openDEditor(blankDRule(it.kind === "permission" ? {kind: "permission", pipelines: [pipe], resources: it.resources.map(r => r.name)}
      : {kind: "release", pipelines: [pipe], stages: it.stage ? [it.stage] : [], branches: it.branch ? [it.branch] : [], requirePrApproved: isProdStage(it)}), true);
    return true;
  }
  if (!ded && !(d.drtoggle || d.drmove || d.drdup || d.drdel)) return false;
  if (d.dkind) { ded.kind = d.dkind; if (ded.kind === "permission") { ded.stages = []; ded.branches = []; ded.requirePrApproved = false; } else ded.resources = []; dedChange(); return true; }
  if (d.daction) { ded.action = d.daction; if (ded.action !== "approve") ded.requirePrApproved = false; dedChange(); return true; }
  if (d.dchip) {
    const g = d.dchip, v = d.v, anyMap = {anypipe: "pipelines", anystage: "stages", anybranch: "branches", anyres: "resources", anyorg: "orgs"};
    if (anyMap[g]) ded[anyMap[g]] = [];
    else ded[g] = ded[g].includes(v) ? ded[g].filter(x => x !== v) : [...ded[g], v];
    dedChange(); return true;
  }
  if (d.dedsave !== undefined) {
    const list = (S.rules.deployRules || []).map(r => ({...r}));
    if (dedIsNew) list.push({...ded}); else list[list.findIndex(r => r.id === ded.id)] = {...ded};
    try { await saveDeployRules(list, dedIsNew ? "Regra criada — aplicando agora" : "Regra salva — aplicando agora"); closeEditor(); }
    catch (e) { alert("Falhou: " + e.message); }
    return true;
  }
  if (d.drtoggle) { await saveDeployRules(S.rules.deployRules.map(r => r.id === d.drtoggle ? {...r, enabled: t.checked} : r), t.checked ? "Regra ativada" : "Regra desativada"); return true; }
  if (d.drmove) { const [i, dir] = d.drmove.split("|").map(Number), l = [...S.rules.deployRules]; l.splice(i + dir, 0, l.splice(i, 1)[0]); await saveDeployRules(l, "Prioridade alterada"); return true; }
  if (d.drdup) { t.closest("details")?.removeAttribute("open"); const src = S.rules.deployRules.find(r => r.id === d.drdup); openDEditor({...src, id: "", name: src.name ? `${src.name} (cópia)` : ""}, true); return true; }
  if (d.drdel) {
    t.closest("details")?.removeAttribute("open");
    const r = S.rules.deployRules.find(x => x.id === d.drdel);
    if (!r || !confirm(`Excluir esta regra?\n\n${dRuleSentence(r).replace(/<[^>]+>/g, "")}`)) return true;
    await saveDeployRules(S.rules.deployRules.filter(x => x.id !== d.drdel), "Regra excluída"); closeEditor(); return true;
  }
  return false;
}

/* ---------- editor de regra (gaveta) */
function openEditor(rule, isNew) {
  ed = blankRule(rule); edIsNew = isNew; edSim = null;
  renderEditor(); runEdSim();
}
function closeEditor() { ed = null; ded = null; renderEditor(); }

function edSimHtml() {
  if (!edSim) return `<div class="muted small">Calculando…</div>`;
  if (edSim.error) return `<div class="error">${esc(edSim.error)}</div>`;
  const o = edSim.open, h = edSim.history, a = ACTIONS[ed.action];
  const byT = Object.entries(h.byTarget).sort((x, y) => y[1] - x[1]).map(([t, n]) => `${esc(t)} ${n}`).join(" · ");
  return `<div class="simgrid">
      <div class="simstat"><div class="v">${o.length}</div><div class="l">de ${edSim.openTotal} PRs abertas agora</div></div>
      <div class="simstat"><div class="v">${h.count}</div><div class="l">de ${h.total} concluídas nos últimos 30 dias${byT ? `<br><span class="muted">${byT}</span>` : ""}</div></div>
    </div>
    ${o.length ? `<div class="simlist">${o.map(p => `<div class="simrow">
        <div class="ell"><span class="prid">#${p.prId}</span> ${esc(p.title)}<div class="small muted">${esc(p.creatorName)} → ${esc(p.target)} · ${esc(p.org)}</div></div>
        ${p.shadowedBy ? `<span class="pill p-warn" title="Uma regra acima decide antes">decide: ${esc(p.shadowedBy)}</span>`
          : p.myVote ? `<span class="pill p-neutral">você já votou</span>` : `<span class="pill p-auto">${a.verb}</span>`}
      </div>`).join("")}</div>` : ""}
    ${!o.length && h.count ? `<div class="small muted" style="margin-top:8px">Nenhuma aberta agora. Últimas que teria pego: ${h.sample.slice(0, 4).map(p => `#${p.prId} (${esc(p.creatorName.split(" ")[0])} → ${esc(p.target)})`).join(", ")}</div>` : ""}
    ${!o.length && !h.count ? `<div class="warnbox" style="margin-top:8px">Nenhuma PR recente se encaixa — confira o nome do criador e a branch.</div>` : ""}`;
}

function runEdSim() {
  clearTimeout(edSimTimer);
  edSimTimer = setTimeout(async () => {
    const snapshot = JSON.stringify(ed);
    let res;
    try { res = await post("/api/simulate", {rule: ed}); } catch (e) { res = {error: e.message}; }
    if (!ed || JSON.stringify(ed) !== snapshot) return;
    edSim = res;
    const box = $("#edsim"); if (box) box.innerHTML = edSimHtml();
  }, 300);
}

function edPreviewSentence() {
  const a = ACTIONS[ed.action];
  return `${ruleSentence(ed)} → <b>${a.short}</b>${ed.action === "approve" && ed.requireBuild ? " depois do build verde" : ""}.`;
}

function renderEditor() {
  const m = $("#modal");
  if (!ed && !ded) { m.innerHTML = ""; m.hidden = true; document.body.classList.remove("noscroll"); return; }
  const scroll = m.querySelector(".dbody")?.scrollTop || 0;
  m.hidden = false; document.body.classList.add("noscroll");
  if (ded) { renderDEditor(m); m.querySelector(".dbody").scrollTop = scroll; return; }
  const chip = (group, value, on, label) =>
    `<button type="button" class="tchip ${on ? "on" : ""}" data-chip="${group}" data-v="${esc(value)}">${on ? "✓ " : ""}${label ?? esc(value)}</button>`;
  const creatorsAll = uniq([...ed.creators, ...S.creators]);
  const targetsAll = uniq([...ed.targets, ...S.targets, ...S.rules.protectedTargets]);
  const prot = ed.targets.filter(isProtected);
  const broad = ed.action === "approve" && !ed.creators.length && !ed.repos.length && !ed.titleContains;
  m.innerHTML = `<div class="scrim" data-edclose></div>
  <aside class="drawer" role="dialog" aria-label="${edIsNew ? "Nova regra" : "Editar regra"}">
    <header><h2>${edIsNew ? "Nova regra" : "Editar regra"}</h2><span class="spacer"></span><button class="ghost" data-edclose title="Fechar (Esc)">✕</button></header>
    <div class="dbody">
      <section><h4><span class="step">1</span>O que fazer</h4>
        <div class="acts">${Object.entries(ACTIONS).map(([k, a]) => `<button type="button" class="actcard ${ed.action === k ? "on" : ""}" data-edaction="${k}">
          <span class="ai">${a.icon}</span><span><b>${a.label}</b><small>${a.desc}</small></span></button>`).join("")}</div>
      </section>
      <section><h4><span class="step">2</span>Quando a PR for criada por</h4>
        <div class="chips">${chip("anycreator", "", !ed.creators.length, "Qualquer pessoa")}${creatorsAll.map(c => chip("creators", c, ed.creators.includes(c))).join("")}</div>
        <input class="addin" data-add="creators" placeholder="Outro nome ou e-mail + Enter — parte do nome basta (“Ana” pega “Ana Souza” e “Ana Lima”)">
      </section>
      <section><h4><span class="step">3</span>Para a branch</h4>
        <div class="chips">${chip("anytarget", "", !ed.targets.length, `Qualquer uma, menos as protegidas`)}${targetsAll.map(t => chip("targets", t, ed.targets.includes(t), `${isProtected(t) ? "🔒 " : ""}${esc(t)}`)).join("")}</div>
        <input class="addin" data-add="targets" placeholder="Outra branch + Enter — aceita curinga (release/*)">
        ${prot.length && ed.action === "approve" ? `<div class="warnbox">🔒 Esta regra vai aprovar sozinha PRs para <b>${prot.map(esc).join(", ")}</b> — isso é subida para produção sem você olhar.</div>` : ""}
      </section>
      <section><h4><span class="step">4</span>Em qual organização</h4>
        <div class="chips">${chip("anyorg", "", !ed.orgs.length, "Todas")}${S.orgs.map(o => chip("orgs", o, ed.orgs.includes(o))).join("")}</div>
      </section>
      <details class="more" ${ed.repos.length || ed.titleContains ? "open" : ""}><summary>Mais filtros — repositório e título</summary>
        <h5>Repositórios</h5>
        <div class="chips">${ed.repos.length ? ed.repos.map(r => chip("repos", r, true)).join("") : `<span class="muted small">Todos os repositórios</span>`}</div>
        <input class="addin" data-add="repos" list="dl-repos" placeholder="Adicionar repositório + Enter — aceita curinga (*-api)">
        <h5>Título contém</h5>
        <input class="full" data-edf="titleContains" value="${esc(ed.titleContains)}" placeholder="ex.: hotfix">
      </details>
      ${ed.action === "approve" ? `<label class="switch opt"><input type="checkbox" data-edf="requireBuild" ${ed.requireBuild ? "checked" : ""}>
        <span>Esperar o build passar antes de aprovar<small>Com o build vermelho ou rodando, a PR espera na fila.</small></span></label>` : ""}
      <section><h4>Nome <span class="muted small" style="font-weight:400;text-transform:none;letter-spacing:0">(opcional — aparece no histórico)</span></h4>
        <input class="full" data-edf="name" value="${esc(ed.name)}" placeholder="ex.: Ana — tudo menos produção"></section>
      <section class="preview"><h4>Prévia</h4>
        <div class="sentence" id="edsentence">${edPreviewSentence()}</div>
        ${broad && !ed.targets.length ? `<div class="warnbox">Sem filtro de criador, esta regra aprova PRs de <b>todo mundo</b>.</div>` : ""}
        <div id="edsim">${edSimHtml()}</div></section>
    </div>
    <footer>${edIsNew ? "" : `<button class="reject" data-rdel="${esc(ed.id)}">Excluir</button>`}<span class="spacer"></span>
      <button data-edclose>Cancelar</button><button class="primary" data-edsave>${edIsNew ? "Criar regra" : "Salvar regra"}</button></footer>
  </aside>`;
  m.querySelector(".dbody").scrollTop = scroll;
}

function edChange(rerender = true) {
  if (rerender) renderEditor();
  else { const s = $("#edsentence"); if (s) s.innerHTML = edPreviewSentence(); }
  edSim = null; const box = $("#edsim"); if (box) box.innerHTML = edSimHtml();
  runEdSim();
}

async function saveEditor() {
  const rules = S.rules.rules.map(r => ({...r}));
  if (!edIsNew) { const i = rules.findIndex(r => r.id === ed.id); rules[i] = {...ed}; }
  else rules.push({...ed});
  try { await saveRules(rules, S.rules.protectedTargets, edIsNew ? "Regra criada — aplicando agora" : "Regra salva — aplicando agora"); closeEditor(); }
  catch (e) { alert("Falhou: " + e.message); }
}

async function handleRuleClick(t, d) {
  if (d.edclose !== undefined) { closeEditor(); return true; }
  if (d.edaction) { ed.action = d.edaction; if (ed.action !== "approve") ed.requireBuild = false; edChange(); return true; }
  if (d.chip) {
    const v = d.v, g = d.chip;
    if (g === "anycreator") ed.creators = [];
    else if (g === "anytarget") ed.targets = [];
    else if (g === "anyorg") ed.orgs = [];
    else ed[g] = ed[g].includes(v) ? ed[g].filter(x => x !== v) : [...ed[g], v];
    edChange(); return true;
  }
  if (d.edsave !== undefined) { await saveEditor(); return true; }
  if (d.newrule !== undefined) { openEditor(blankRule(), true); return true; }
  if (d.tpl) { t.closest("details")?.removeAttribute("open"); openEditor(blankRule(TEMPLATES[Number(d.tpl)].rule), true); return true; }
  if (d.redit) { if (e_isInteractive(t)) return false; openEditor(S.rules.rules.find(r => r.id === d.redit), false); return true; }
  if (d.rtoggle) { await saveRules(S.rules.rules.map(r => r.id === d.rtoggle ? {...r, enabled: t.checked} : r), undefined, t.checked ? "Regra ativada" : "Regra desativada"); return true; }
  if (d.rmove) {
    const [i, dir] = d.rmove.split("|").map(Number), rules = [...S.rules.rules];
    rules.splice(i + dir, 0, rules.splice(i, 1)[0]); await saveRules(rules, undefined, "Prioridade alterada"); return true;
  }
  if (d.rdup) {
    t.closest("details")?.removeAttribute("open");
    const src = S.rules.rules.find(r => r.id === d.rdup);
    openEditor({...src, id: "", name: src.name ? `${src.name} (cópia)` : ""}, true); return true;
  }
  if (d.rdel) {
    t.closest("details")?.removeAttribute("open");
    const r = S.rules.rules.find(x => x.id === d.rdel);
    if (!r || !confirm(`Excluir esta regra?\n\n${ruleSentence(r).replace(/<[^>]+>/g, "")}`)) return true;
    await saveRules(S.rules.rules.filter(x => x.id !== d.rdel), undefined, "Regra excluída"); closeEditor(); return true;
  }
  if (d.unprot) { await saveRules(S.rules.rules, S.rules.protectedTargets.filter(x => x !== d.unprot), `${d.unprot} não é mais protegida`); return true; }
  return false;
}
// O cartão inteiro abre o editor, menos os controles dentro dele.
const e_isInteractive = t => t.closest("button, a, input, details") && !t.matches("[data-redit]");

document.addEventListener("keydown", async e => {
  if (e.key === "Escape" && (ed || ded)) { closeEditor(); return; }
  if ((e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "j" || e.key === "k") && !ed && !ded && wide() && ["fila", "todas", "minhas", "builds"].includes(tab)
      && !e.target.closest("input, select, textarea") && queueOrder.length) {
    e.preventDefault();
    const i = queueOrder.indexOf(focusKey), next = (e.key === "ArrowDown" || e.key === "j") ? Math.min(i + 1, queueOrder.length - 1) : Math.max(i - 1, 0);
    focusKey = queueOrder[next]; render();
    document.querySelector(`[data-row="${CSS.escape(focusKey)}"]`)?.scrollIntoView({block: "nearest"});
    return;
  }
  if (e.key !== "Enter") return;
  const el = e.target;
  if (el.dataset?.dadd && ded) {
    e.preventDefault();
    const v = el.value.trim(), g = el.dataset.dadd;
    if (v && !ded[g].includes(v)) ded[g] = [...ded[g], v];
    dedChange(); $(`#modal [data-dadd="${g}"]`)?.focus(); return;
  }
  if (el.dataset?.add && ed) {
    e.preventDefault();
    const v = el.value.trim(), g = el.dataset.add;
    if (v && !ed[g].includes(v)) ed[g] = [...ed[g], v];
    edChange();
    $(`#modal [data-add="${g}"]`)?.focus();
  }
  if (el.id === "addProt") {
    const v = el.value.trim();
    if (v && !S.rules.protectedTargets.includes(v)) await saveRules(S.rules.rules, [...S.rules.protectedTargets, v], `${v} agora é protegida`);
  }
});
document.addEventListener("input", e => {
  const df = e.target.dataset?.dedf;
  if (df && ded) {
    ded[df] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
    if (e.target.type === "checkbox") dedChange();
    else { const s = $("#edsentence"); if (s) s.innerHTML = `${dRuleSentence(ded)} → <b>${DACTIONS[ded.kind][ded.action].label.toLowerCase()}</b>.`; }
    return;
  }
  const f = e.target.dataset?.edf;
  if (!f || !ed) return;
  ed[f] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  edChange(e.target.type === "checkbox");
});

/* ------------------------------------------------------------------ análise */
async function loadAnalytics(force) {
  if (aLoading) return;
  aLoading = true; A = null;
  if (tab === "analise") renderAnalytics();
  try {
    const r = await fetch(`/api/analytics?days=${aDays}&org=${encodeURIComponent(aOrg)}${force ? "&force=1" : ""}`);
    A = await r.json(); if (!r.ok) throw new Error(A.error);
  } catch (e) { A = {error: e.message}; }
  aLoading = false;
  if (tab === "analise") renderAnalytics();
}

function hbars(items, valueKey = "count", fmt = v => v) {
  const max = Math.max(1, ...items.map(i => i[valueKey] || 0));
  return items.length ? `<div class="hbars">${items.map(i => `<div class="row" data-tip="${esc(i.name)}: ${fmt(i[valueKey])}">
    <span class="name">${esc(i.name)}</span><div class="track"><div class="fill" style="width:${(100 * (i[valueKey] || 0) / max).toFixed(1)}%"></div></div>
    <span class="val">${fmt(i[valueKey])}</span></div>`).join("")}</div>` : `<div class="muted small">Sem dados no período.</div>`;
}

function columns(daily, series) {
  const max = Math.max(1, ...daily.map(d => series.reduce((s, x) => s + d[x.key], 0)));
  const fmtD = iso => new Date(iso + "T12:00").toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit"});
  return `<div class="cols">${daily.map(d => {
      const tip = `${fmtD(d.date)}\n` + series.map(x => `${x.label}: ${d[x.key]}`).join("\n");
      return `<div class="c" data-tip="${esc(tip)}">${series.filter(x => d[x.key]).map(x =>
        `<div class="seg1" style="height:${(100 * d[x.key] / max).toFixed(1)}%;background:${x.color}"></div>`).join("")}</div>`;
    }).join("")}</div>
    <div class="xaxis"><span>${fmtD(daily[0].date)}</span><span>máx. ${max}/dia</span><span>${fmtD(daily[daily.length - 1].date)}</span></div>`;
}

function renderAnalytics() {
  const head = `<div class="toolbar">
      <div class="seg">${[7, 30, 90].map(d => `<button class="${aDays === d ? "on" : ""}" data-days="${d}">${d} dias</button>`).join("")}</div>
      <div class="seg">${["", ...S.orgs].map(o => `<button class="${aOrg === o ? "on" : ""}" data-aorg="${esc(o)}">${o ? esc(o) : "Todas"}</button>`).join("")}</div>
      <span class="spacer"></span><button class="sm" id="aReload">↻ Recarregar do Azure</button></div>`;
  if (!A) { $("#view").innerHTML = head + `<div class="card"><div class="empty"><b>Calculando…</b>Lendo PRs concluídas no Azure.</div></div>`; if (!aLoading) loadAnalytics(); return; }
  if (A.error) { $("#view").innerHTML = head + `<div class="error">${esc(A.error)}</div>`; return; }
  const k = A.kpis;
  const tiles = [
    ["PRs concluídas", k.merged, `em ${A.days} dias`],
    ["Lead time mediano", fmtH(k.medianLeadH), "abertura → conclusão"],
    ["Aguardando meu voto", k.pending, k.oldestPendingH ? `mais antiga há ${fmtH(k.oldestPendingH)}` : "fila zerada"],
    ["Aprovações minhas", k.autoApprovals + k.manualApprovals, `${k.autoApprovals} auto · ${k.manualApprovals} manual`],
    ["Meu tempo de resposta", fmtH(k.myMedianResponseH), "mediana, votos manuais"],
    ["Abertas com problema", k.conflicts + k.buildFailed, `${k.conflicts} conflito · ${k.buildFailed} build ✗`],
  ];
  const autoShare = (k.autoApprovals + k.manualApprovals) ? Math.round(100 * k.autoApprovals / (k.autoApprovals + k.manualApprovals)) : null;
  const maxMerged = Math.max(1, ...A.creators.map(c => c.merged));
  $("#view").innerHTML = head
    + Object.entries(A.errors || {}).map(([o, e]) => `<div class="error"><b>${esc(o)}:</b> ${esc(e)}</div>`).join("")
    + `<div class="kpis">${tiles.map(([l, v, s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("")}</div>
    <div class="grid2">
      <div class="card"><div class="card-h"><h3>Minhas aprovações por dia</h3><span class="spacer"></span>
        <div class="legend"><span><i style="background:var(--series-1)"></i>Piloto</span><span><i style="background:var(--series-2)"></i>Manual</span></div></div>
        <div class="card-b">${columns(A.daily, [{key: "auto", label: "Piloto", color: "var(--series-1)"}, {key: "manual", label: "Manual", color: "var(--series-2)"}])}
        <div class="small muted" style="margin-top:8px">${autoShare !== null ? `${autoShare}% das suas aprovações no período foram feitas pelo piloto.` : "Nenhuma aprovação registrada no período (o histórico começa quando o piloto foi ligado)."}</div></div></div>
      <div class="card"><div class="card-h"><h3>PRs concluídas por dia</h3></div>
        <div class="card-b">${columns(A.daily, [{key: "merged", label: "Concluídas", color: "var(--series-1)"}])}</div></div>
    </div>
    <div class="lay-side" style="margin-top:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)"><div class="card"><div class="card-h"><h3>Por criador</h3><span class="muted small">concluídas no período · abertas agora</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Criador</th><th style="width:38%">Concluídas</th><th class="num">Abertas</th><th class="num">Lead time mediano</th><th class="num">Para master/main</th><th></th></tr></thead><tbody>
      ${A.creators.map(c => `<tr><td>${esc(c.name)}</td>
        <td><div class="inbar"><div class="fill" style="width:${(85 * c.merged / maxMerged).toFixed(1)}%"></div><b class="small">${c.merged}</b></div></td>
        <td class="num">${c.open}</td><td class="num">${fmtH(c.medianLeadH)}</td><td class="num">${c.toMaster}</td>
        <td class="num">${S.rules.rules.some(r => r.enabled && r.creators.some(x => c.name.toLowerCase().includes(x.toLowerCase()))) ? `<span class="pill p-auto">tem regra</span>` : `<button class="ghost sm" data-mkrule-name="${esc(c.name)}">+ regra</button>`}</td></tr>`).join("")
        || `<tr><td colspan="6" class="empty">Sem dados.</td></tr>`}
      </tbody></table></div></div>
    <div class="col">
      <div class="card"><div class="card-h"><h3>Repositórios mais movimentados</h3></div><div class="card-b">${hbars(A.repos)}</div></div>
      <div class="card"><div class="card-h"><h3>Idade das PRs abertas</h3></div><div class="card-b">${hbars(A.aging)}
        <h3 style="font-size:14px;margin:18px 0 8px">Destino das concluídas</h3>${hbars(A.targets)}</div></div>
    </div></div>`;
}

/* ------------------------------------------------------------------ histórico */
function renderHistory() {
  const label = a => {
    const dl = {"deploy-approve": ["Aprovou release", "p-good"], "deploy-reject": ["Rejeitou release", "p-bad"],
                "build-retry": ["Tentou build de novo", "p-neutral"], "build-rerun": ["Rodou build de novo", "p-neutral"], "build-cancel": ["Cancelou build", "p-bad"],
                permit: ["Liberou permissão", "p-good"], cancel: ["Cancelou run", "p-bad"]}[a.action];
    if (dl) return dl;
    if (a.action === "archive") return [`Arquivou`, "p-neutral"];
    if (a.action === "unarchive") return [`Desarquivou`, "p-neutral"];
    return VOTES[a.vote] || ["Removeu o voto", "p-neutral"];
  };
  const list = S.activity.filter(a => histFilter === "all" || (histFilter === "auto" ? a.by === "auto" : a.by !== "auto"));
  $("#view").innerHTML = `<div class="toolbar"><div class="seg">
      ${[["all", "Tudo"], ["auto", "Piloto"], ["manual", "Manual"]].map(([v, l]) => `<button class="${histFilter === v ? "on" : ""}" data-hist="${v}">${l}</button>`).join("")}
    </div><span class="muted small">últimos ${S.activity.length} eventos</span></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Item</th></tr></thead><tbody>
    ${list.map(a => { const [l, c] = label(a); return `<tr>
      <td class="small muted" style="white-space:nowrap">${new Date(a.ts).toLocaleString("pt-BR")}</td>
      <td>${a.by === "auto" ? `<span class="pill p-auto">⚡ piloto</span>` : `<span class="pill p-neutral">você</span>`}${a.detail ? `<div class="small muted">${esc(a.detail)}</div>` : ""}</td>
      <td><span class="pill ${c}">${l}</span></td>
      <td>${a.kind ? `<a href="${esc(a.url)}" target="_blank" rel="noopener" style="text-decoration:none">${a.kind === "permission" ? "🔑" : a.kind === "build" ? "🛠" : "🚀"} ${esc(a.pipeline)}${a.stage ? ` → <b>${esc(a.stage)}</b>` : ""}</a>
        <div class="small muted"><i class="dot" style="background:${orgColor(a.org)}"></i> ${esc(a.org)} · ${esc(a.branch || "")} ${esc(a.version || "")}${a.prNumber ? ` · PR #${a.prNumber}` : ""}</div>`
        : `<a href="${esc(a.url)}" target="_blank" rel="noopener" style="text-decoration:none"><span class="prid">#${a.prId}</span> ${esc(a.title)}</a>
        <div class="small muted"><i class="dot" style="background:${orgColor(a.org)}"></i> ${esc(a.org)} · ${esc(a.creatorName)} → ${esc(a.target)}</div>`}</td></tr>`; }).join("")
      || `<tr><td colspan="4" class="empty">Nada ainda.</td></tr>`}
    </tbody></table></div></div>`;
}

/* ------------------------------------------------------------------ ambiente */
async function loadConfig() {
  CFG = await (await fetch("/api/config")).json();
  cfgDraft = CFG.orgs.map(o => ({originalName: o.name, name: o.name, url: o.url, pat: "", enabled: o.enabled, hasPat: o.hasPat,
                                 patCommand: o.patCommand, patStore: o.patStore, me: o.me, test: null}));
  cfgDraft.pollSeconds = CFG.pollSeconds;
  if (!cfgDraft.length) cfgDraft.push(newOrgDraft());
  if (tab === "ambiente") renderEnv();
}
const newOrgDraft = () => ({originalName: "", name: "", url: "", pat: "", enabled: true, hasPat: false, test: null});
const tokensUrl = url => url ? `${url.includes("://") ? url.replace(/\/$/, "") : "https://dev.azure.com/" + url}/_usersSettings/tokens` : "";

function renderEnv() {
  if (!cfgDraft) { $("#view").innerHTML = `<div class="card"><div class="empty"><b>Carregando…</b></div></div>`; loadConfig(); return; }
  const rows = cfgDraft.map((o, i) => `<div class="orgform">
      <label class="f">Nome (como aparece na tela)<input data-cf="name" data-i="${i}" value="${esc(o.name)}" placeholder="ex.: MinhaEmpresa"></label>
      <label class="f">Organização ou URL<input data-cf="url" data-i="${i}" value="${esc(o.url)}" placeholder="minha-org ou https://dev.azure.com/minha-org"></label>
      <label class="f"><span>PAT${o.url ? ` · <a href="${esc(tokensUrl(o.url))}" target="_blank" rel="noopener">criar um ↗</a>` : ""}</span>
        <input type="password" autocomplete="off" data-cf="pat" data-i="${i}" value="${esc(o.pat)}" placeholder="${o.hasPat ? (o.patCommand ? "vem de patCommand — vazio mantém" : "•••••• salvo — vazio mantém") : "cole o PAT"}"></label>
      <div class="oact">
        <label class="switch" title="Ativa"><input type="checkbox" data-cf="enabled" data-i="${i}" ${o.enabled ? "checked" : ""}></label>
        <button class="sm" data-cftest="${i}" ${cfgBusy ? "disabled" : ""}>Testar</button>
        <button class="ghost sm" data-cfdel="${i}" title="Remover">✕</button>
      </div>
      ${o.me && !o.test ? `<div class="who">Conectado como <b>${esc(o.me.name)}</b>${o.me.email && o.me.email !== o.me.name ? ` · ${esc(o.me.email)}` : ""}${o.patStore ? ` · 🔒 PAT no ${esc(o.patStore)}` : ""}</div>` : ""}
      ${o.test ? `<div class="tests">${o.test.error ? `<div class="chk"><span class="ko">✗</span>${esc(o.test.error)}</div>` : o.test.running ? `<div class="muted small">Testando…</div>`
        : o.test.checks.map(c => `<div class="chk"><span class="${c.ok ? "ok" : "ko"}">${c.ok ? "✓" : "✗"}</span><span><b>${esc(c.label)}</b> <span class="muted">${esc(c.detail)}</span></span></div>`).join("")}</div>` : ""}
    </div>`).join("");
  $("#view").innerHTML = `
    ${!S.configured ? `<div class="notice">👋 Bem-vindo! Cadastre ao menos uma organização do Azure DevOps com o seu PAT para começar. Tudo fica só nesta máquina.</div>` : ""}
    <div class="lay-side"><div class="card">
      <div class="card-h"><h3>Organizações / contas Azure DevOps</h3><span class="muted small">Uma linha por organização. Cada uma usa o PAT da sua conta naquela org.</span>
        <span class="spacer"></span><button class="sm" data-cfadd>+ Adicionar organização</button></div>
      ${rows}
      <div class="card-h" style="border-top:1px solid var(--line);border-bottom:0">
        <label class="small" style="display:flex;gap:8px;align-items:center">Ler o Azure a cada <input type="number" min="15" max="3600" data-cf="pollSeconds" value="${esc(cfgDraft.pollSeconds)}" style="width:80px"> segundos</label>
        <span class="spacer"></span>
        <button data-cfreset>Descartar</button><button class="primary" data-cfsave ${cfgBusy ? "disabled" : ""}>Salvar e conectar</button>
      </div>
    </div>
    <div class="col">
      <div class="card"><div class="card-h"><h3>Como criar o PAT</h3></div><div class="card-b help">
        <ol class="steps-help">
          <li>No Azure DevOps da organização: <b>User settings → Personal access tokens → New token</b> (o link “criar ↗” acima abre direto).</li>
          <li><b>Organization:</b> a própria org (ou All accessible organizations).</li>
          <li><b>Scopes → Custom defined:</b>
            <div><code>Code</code> Read &amp; write — ler e votar nas PRs</div>
            <div><code>Build</code> Read &amp; execute — ver runs, cancelar</div>
            <div><code>Release</code> Read, write, execute &amp; manage — aprovar releases</div>
            <div>Para liberar permissão de recurso, inclua o escopo do recurso (ex.: <code>Variable Groups</code> Read, create &amp; manage) — e sua conta precisa ser admin dele.</div></li>
          <li>Cole aqui, clique <b>Testar</b> e depois <b>Salvar e conectar</b>.</li>
        </ol></div></div>
      <div class="card"><div class="card-h"><h3>Sobre</h3><span class="spacer"></span><button class="sm" data-checkupd>Procurar atualização</button></div><div class="card-b help">
        PR Pilot <b>${esc(S.app?.version)}</b> (build ${esc(S.app?.build)}, ${esc(S.app?.platform)})
        ${S.update?.available ? ` · <b>${esc(S.update.version)}</b> disponível` : S.update?.disabled ? " · atualização automática desligada (build de desenvolvimento)" : S.update?.checkedAt ? " · versão mais nova" : ""}
      </div></div>
      <div class="card"><div class="card-h"><h3>Onde ficam os dados</h3></div><div class="card-b help">
        Tudo é local: <code>${esc(CFG?.dataDir || "")}</code> (fora do repositório). O PAT <b>nunca</b> fica em texto: vai cifrado para o ${S.app?.platform === "windows" ? "cofre do Windows (DPAPI — só a sua conta do Windows decifra)" : "Keychain do macOS"}, e o <code>config.json</code> guarda só a referência. A tela nunca recebe o PAT de volta.
        <br>O backend atende só em <code>127.0.0.1:${esc(CFG?.port || "")}</code>; nada é exposto na rede.
        <br>A tela só responde ao app: cada execução gera uma chave nova, então outros programas da máquina não agem por você.
        <br>Para outra pessoa usar: clonar o repositório, rodar <code>./build-app.sh</code> e cadastrar as próprias contas aqui.</div></div>
    </div></div>`;
}

async function cfgTest(i) {
  const o = cfgDraft[i];
  o.test = {running: true}; renderEnv();
  try { o.test = await post("/api/config/test", {name: o.name, originalName: o.originalName, url: o.url, pat: o.pat}); }
  catch (e) { o.test = {error: e.message}; }
  renderEnv();
}

async function cfgSave() {
  cfgBusy = true; renderEnv();
  try {
    await post("/api/config", {pollSeconds: Number(cfgDraft.pollSeconds) || 60,
      orgs: cfgDraft.filter(o => o.name || o.url || o.pat).map(o => ({name: o.name, originalName: o.originalName, url: o.url, pat: o.pat, enabled: o.enabled}))});
    toast("Configuração salva — conectando…");
    cfgBusy = false; cfgDraft = null; await load(); setTimeout(async () => { await load(); if (tab === "ambiente") loadConfig(); }, 4000);
  } catch (e) { cfgBusy = false; alert("Não salvou: " + e.message); renderEnv(); }
}

async function handleEnvClick(t, d) {
  if (tab !== "ambiente" || !cfgDraft) return false;
  if (d.cfadd !== undefined) { cfgDraft.push(newOrgDraft()); renderEnv(); return true; }
  if (d.cfdel !== undefined) {
    const o = cfgDraft[Number(d.cfdel)];
    if (o.originalName && !confirm(`Remover ${o.originalName}? (só ao salvar)`)) return true;
    cfgDraft.splice(Number(d.cfdel), 1); renderEnv(); return true;
  }
  if (d.cftest !== undefined) { await cfgTest(Number(d.cftest)); return true; }
  if (d.cfsave !== undefined) { await cfgSave(); return true; }
  if (d.cfreset !== undefined) { cfgDraft = null; renderEnv(); return true; }
  if (d.cf === "enabled") { cfgDraft[Number(d.i)].enabled = t.checked; return true; }
  return false;
}
document.addEventListener("input", e => {
  const f = e.target.dataset?.cf;
  if (!f || !cfgDraft || f === "enabled") return;
  if (f === "pollSeconds") cfgDraft.pollSeconds = e.target.value;
  else { cfgDraft[Number(e.target.dataset.i)][f] = e.target.value; cfgDraft[Number(e.target.dataset.i)].test = null; }
});

/* ------------------------------------------------------------------ eventos */
async function vote(k, v, btn) {
  const p = S.prs.find(x => key(x) === k);
  if (!p) return;
  if (v >= 5 && isProtected(p.target) && !confirm(`Aprovar PR para ${p.target}?\n\n#${p.prId} ${p.title}`)) return;
  if (btn) btn.disabled = true;
  try { await post("/api/vote", {org: p.org, prId: p.prId, vote: v}); toast(`#${p.prId}: ${(VOTES[v] || ["voto removido"])[0].toLowerCase()}`); await load(); }
  catch (e) { alert("Falhou: " + e.message); if (btn) btn.disabled = false; }
}

function newRuleFrom(creator, target, action = "approve") {
  openEditor(blankRule({action, creators: creator ? [creator] : [], targets: target ? [target] : []}), true);
}

document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-expand], [data-redit], [data-dredit], [data-edclose], a, input");
  if (!t) return;
  const d = t.dataset;
  if (await handleEnvClick(t, d)) return;
  if (await handleDeployRuleClick(t, d)) return;
  if (await handleRuleClick(t, d)) return;
  if (d.dep) { t.closest("details")?.removeAttribute("open"); return decideDeploy(d.k, d.dep, t); }
  if (d.bact) return buildAction(d.k, d.bact, t);
  if (d.update !== undefined) return runUpdate();
  if (d.checkupd !== undefined) return window.checkUpdate(true);
  if (d.bstatus !== undefined) { BF.status = d.bstatus; render(); return; }
  if (d.btoggle) { BF[d.btoggle] = !BF[d.btoggle]; render(); return; }
  if (d.gofila) { window.openTarget(`fila/${d.gofila}`); return; }
  if (d.gopr) { const p = S.prs.find(x => key(x) === d.gopr); window.openTarget(p ? `todas/${d.gopr}` : S.myPrs.some(x => key(x) === d.gopr) ? `minhas/${d.gopr}` : "builds/"); return; }
  if (d.kind !== undefined && !ded) { F.kind = d.kind; render(); return; }
  if (d.goto) { tab = d.goto; history.replaceState(null, "", "#" + tab); render(); window.scrollTo(0, 0); return; }
  if (d.kfilter) { F.conflict = !F.conflict; render(); return; }
  if (d.tab) {
    tab = d.tab; history.replaceState(null, "", "#" + tab); render(); window.scrollTo(0, 0); return; }
  if (d.org !== undefined) { F.org = d.org; render(); return; }
  if (d.vote !== undefined) { t.closest("details")?.removeAttribute("open"); return vote(d.k, Number(d.vote), t); }
  if (d.sel) { t.checked ? selected.add(d.sel) : selected.delete(d.sel); render(); return; }
  if (t.id === "selAll") { document.querySelectorAll("[data-sel]").forEach(c => t.checked ? selected.add(c.dataset.sel) : selected.delete(c.dataset.sel)); render(); return; }
  if (d.expand && !e.target.closest("a")) {
    if (wide()) focusKey = d.expand; else expanded.has(d.expand) ? expanded.delete(d.expand) : expanded.add(d.expand);
    render(); return;
  }
  if (d.archive) {
    t.closest("details")?.removeAttribute("open");
    const [org, prId] = d.archive.split("|");
    const restore = d.restore === "1" || S.prs.find(p => key(p) === d.archive)?.archived;
    await post("/api/archive", {items: [{org, prId: Number(prId)}], archive: !restore});
    toast(restore ? `#${prId} voltou para a fila` : `#${prId} arquivada`); return load();
  }
  if (d.bulk) {
    const items = [...selected].map(k => S.prs.find(p => key(p) === k)).filter(Boolean);
    if (d.bulk === "clear") { selected.clear(); return render(); }
    if (d.bulk === "archive") { await post("/api/archive", {items: items.map(p => ({org: p.org, prId: p.prId})), archive: true}); toast(`${items.length} arquivada(s)`); }
    if (d.bulk === "approve") {
      const prot = items.filter(p => isProtected(p.target));
      if (!confirm(`Aprovar ${items.length} PR(s)?${prot.length ? `\n\n⚠ ${prot.length} para branch protegida.` : ""}`)) return;
      let ok = 0; for (const p of items) { try { await post("/api/vote", {org: p.org, prId: p.prId, vote: 10}); ok++; } catch {} }
      toast(`${ok} de ${items.length} aprovada(s)`);
    }
    selected.clear(); return load();
  }
  if (d.mkrule || d.mkruleArch) { const p = S.prs.find(x => key(x) === (d.mkrule || d.mkruleArch)); t.closest("details")?.removeAttribute("open");
    return newRuleFrom(p.creatorName.split(" ")[0], p.target, d.mkruleArch ? "archive" : "approve"); }
  if (d.mkruleName) return newRuleFrom(d.mkruleName.split(" ")[0], "");
  if (d.setting) {
    const v = t.checked;
    return saveSettings(d.setting === "active" ? {paused: !v} : {[d.setting]: v}).then(() => toast("Salvo"));
  }
  if (d.days) { aDays = Number(d.days); return loadAnalytics(); }
  if (d.aorg !== undefined) { aOrg = d.aorg; return loadAnalytics(); }
  if (t.id === "aReload") return loadAnalytics(true);
  if (d.hist) { histFilter = d.hist; return render(); }
});

document.addEventListener("input", e => {
  if (e.target.id === "q") { F.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  if (e.target.id === "creatorSel") { F.creator = e.target.value; render(); }
  if (e.target.id === "relProd") { relOnlyProd = e.target.checked; render(); }
});
document.addEventListener("toggle", e => {
  if (e.target.matches?.("details.menu") && e.target.open)
    document.querySelectorAll("details.menu[open]").forEach(m => m !== e.target && m.removeAttribute("open"));
}, true);
document.addEventListener("click", e => {
  if (!e.target.closest("details.menu")) document.querySelectorAll("details.menu[open]").forEach(m => m.removeAttribute("open"));
}, true);

$("#autoOn").addEventListener("change", e => saveSettings({paused: !e.target.checked}).then(() => toast(e.target.checked ? "Automação ligada" : "Automação pausada")));
$("#refresh").onclick = async () => { await post("/api/refresh"); toast("Lendo o Azure…"); setTimeout(load, 2500); setTimeout(load, 8000); if (tab === "analise") loadAnalytics(true); };

let lastWide = wide();
addEventListener("resize", () => { if (wide() !== lastWide) { lastWide = wide(); if (S) render(); } });

const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - w - 8) + "px";
  tip.style.top = (e.clientY + 14 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 14) + "px";
});

load();
setInterval(() => {
  // não redesenha no meio de uma edição (menu aberto, digitando regra)
  if (ed || ded || tab === "ambiente" || document.querySelector("details.menu[open]") || document.activeElement?.id === "addProt") return;
  load();
}, 15000);
</script>
</body>
</html>
