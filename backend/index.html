<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Pilot</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f8f9fb; --text: #15181e; --text-2: #4a5160; --muted: #7a8293;
    --line: #e4e7ec; --line-2: #d3d8e0; --accent: #2a78d6; --accent-soft: #e8f1fc;
    --good: #12804a; --good-bg: #e2f4ea; --bad: #c0362c; --bad-bg: #fde9e7; --warn: #946200; --warn-bg: #fff3d4;
    --series-1: #2a78d6; --series-2: #eb6834; --org-1: #1baf7a; --org-2: #6250d6; --org-3: #e87ba4;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1115; --surface: #181b21; --surface-2: #1e2229; --text: #eceef2; --text-2: #b4bac6; --muted: #858c9a;
      --line: #282d36; --line-2: #343a45; --accent: #3987e5; --accent-soft: #19283b;
      --good: #4cc98a; --good-bg: #14301f; --bad: #ff7f75; --bad-bg: #3a1916; --warn: #e3b341; --warn-bg: #33290f;
      --series-1: #3987e5; --series-2: #d95926; --org-1: #199e70; --org-2: #9085e9; --org-3: #d55181;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --surface: #181b21; --surface-2: #1e2229; --text: #eceef2; --text-2: #b4bac6; --muted: #858c9a;
    --line: #282d36; --line-2: #343a45; --accent: #3987e5; --accent-soft: #19283b;
    --good: #4cc98a; --good-bg: #14301f; --bad: #ff7f75; --bad-bg: #3a1916; --warn: #e3b341; --warn-bg: #33290f;
    --series-1: #3987e5; --series-2: #d95926; --org-1: #199e70; --org-2: #9085e9; --org-3: #d55181;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  /* casca: menu lateral + conteúdo */
  .shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 16px; padding: 16px 10px 14px;
          background: var(--surface); border-right: 1px solid var(--line); z-index: 20; }
  .brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 9px; letter-spacing: -.01em; padding: 0 8px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; }
  .nav { display: grid; gap: 1px; }
  .nav .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 10px 4px; font-weight: 650; }
  .nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 7px 10px; border-radius: 7px;
                color: var(--text-2); font-weight: 500; text-align: left; white-space: nowrap; }
  .nav button:hover { background: var(--surface-2); color: var(--text); }
  .nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
  .nav svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nav .count { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; padding: 0 7px; border-radius: 999px;
                background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); font-weight: 600; }
  .nav button.on .count { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav .count.hot { background: var(--bad); border-color: var(--bad); color: #fff; }
  .side-foot { margin-top: auto; display: grid; gap: 10px; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: 12px; }
  .health { display: grid; gap: 5px; color: var(--text-2); font-size: 12px; }
  .health span { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .health .ago { color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .spacer { flex: 1; }
  .content { padding: 18px 24px 48px; min-width: 0; }
  .vhead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .vhead h1 { margin: 0; font-size: 19px; letter-spacing: -.015em; }
  .vhead .sub { color: var(--muted); font-size: 13px; }
  @media (max-width: 860px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .side { height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px;
            border-right: 0; border-bottom: 1px solid var(--line); }
    .nav { display: flex; order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; }
    .nav .grp { display: none; }
    .nav button { width: auto; }
    .side-foot { margin: 0 0 0 auto; padding: 0; border: 0; display: flex; align-items: center; }
    .health, .side-foot .label-pause { display: none; }
    .content { padding: 14px 16px 48px; }
  }

  /* controles */
  button, .btn { font: inherit; border: 1px solid var(--line-2); background: var(--surface); color: var(--text);
                 border-radius: 7px; padding: 6px 12px; cursor: pointer; line-height: 1.2; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.approve { background: var(--good); border-color: var(--good); color: #fff; }
  button.reject { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--surface); }
  button.ghost { border-color: transparent; background: none; }
  button.ghost:hover { background: var(--surface-2); }
  button.sm, .btn.sm { padding: 4px 9px; font-size: 13px; }
  a.btn { display: inline-flex; align-items: center; }
  input, select { font: inherit; background: var(--surface); color: var(--text); border: 1px solid var(--line-2);
                  border-radius: 7px; padding: 6px 9px; min-width: 0; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { flex-shrink: 0; appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line-2);
                  position: relative; cursor: pointer; transition: background .15s; border: 0; padding: 0; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
                         border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked { background: var(--good); }
  .switch input:checked::after { transform: translateX(14px); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 16px; }
  .card-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .card-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .card-b { padding: 14px 16px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 9px 12px; margin-bottom: 10px; font-size: 13px; }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; font-size: 13px;
            display: flex; gap: 10px; align-items: center; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; box-shadow: var(--shadow); min-width: 0; }
  .kpi .v { font-size: 20px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .kpi .l, .kpi .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .l { font-size: 11.5px; color: var(--text-2); }
  .kpi .s { font-size: 11px; color: var(--muted); }
  .kpi.alert .v { color: var(--bad); }

  /* toolbar */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input[type=search] { flex: 1 1 220px; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; border-radius: 0; padding: 6px 11px; background: none; color: var(--text-2); }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .bulk { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--accent-soft); border-radius: 8px;
          margin-bottom: 10px; font-size: 13px; flex-wrap: wrap; }

  /* lista de PRs */
  .pr { display: grid; grid-template-columns: 16px 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 14px;
        border-top: 1px solid var(--line); }
  .list-head { display: flex; gap: 12px; align-items: center; padding: 9px 16px; }
  .list-head + .pr { border-top: 1px solid var(--line); }
  .pr:first-child { border-top: 0; }
  .pr:hover { background: var(--surface-2); }
  .pr.open { background: var(--surface-2); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 650;
            color: #fff; letter-spacing: .02em; }
  .pr .main { min-width: 0; cursor: pointer; }
  .pr .t { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .pr .t .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prid { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .meta { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 3px; }
  .meta .sep { color: var(--line-2); }
  .branch { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
  .branch b { color: var(--text); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; border-radius: 999px;
          padding: 1px 8px; white-space: nowrap; border: 1px solid transparent; }
  .p-good { background: var(--good-bg); color: var(--good); }
  .p-bad { background: var(--bad-bg); color: var(--bad); }
  .p-warn { background: var(--warn-bg); color: var(--warn); }
  .p-auto { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--accent); }
  .p-neutral { background: var(--surface-2); color: var(--text-2); border-color: var(--line); }
  .actions { display: flex; gap: 6px; align-items: center; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--text-2); font-size: 15px; margin-bottom: 4px; }

  .detail { grid-column: 3 / -1; display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; padding: 4px 0 6px; cursor: default; }
  .detail h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .desc { white-space: pre-wrap; font-size: 13px; color: var(--text-2); max-height: 220px; overflow: auto; background: var(--surface);
          border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .kv:last-child { border-bottom: 0; }

  /* menu */
  details.menu { position: relative; }
  details.menu summary { list-style: none; cursor: pointer; border: 1px solid var(--line-2); border-radius: 7px; padding: 4px 9px;
                         background: var(--surface); line-height: 1.2; font-size: 13px; }
  details.menu summary::-webkit-details-marker { display: none; }
  details.menu .items { position: absolute; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line-2);
                        border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 5px; min-width: 250px; z-index: 30; }
  details.menu .items button, details.menu .items a { display: block; width: 100%; text-align: left; border: 0; background: none;
                        padding: 7px 10px; border-radius: 6px; font-size: 13px; text-decoration: none; }
  details.menu .items button:hover, details.menu .items a:hover { background: var(--surface-2); }
  details.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

  /* tabelas */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 10px; text-align: left; border-top: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 11.5px; color: var(--muted); font-weight: 600; border-top: 0; white-space: nowrap; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rules td input:not([type=checkbox]), .rules td select { width: 100%; min-width: 90px; padding: 5px 7px; }
  .rules select[data-f="action"] { min-width: 132px; }
  .rules .ord { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rules tr.off td { opacity: .5; }
  .match { font-weight: 600; font-variant-numeric: tabular-nums; cursor: help; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .settings .switch { align-items: flex-start; }
  .settings .switch small { display: block; color: var(--muted); font-size: 12px; }
  .help { font-size: 12.5px; color: var(--text-2); line-height: 1.6; }
  .help code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }

  /* gráficos */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid2 > .card + .card { margin-top: 0; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .cols { display: flex; align-items: flex-end; gap: 2px; height: 160px; border-bottom: 1px solid var(--line-2); padding-top: 6px; }
  .cols .c { flex: 1; display: flex; flex-direction: column-reverse; gap: 2px; height: 100%; justify-content: flex-start; min-width: 2px; }
  .cols .c:hover { background: var(--surface-2); }
  .cols .seg1, .cols .seg2 { width: 100%; }
  .cols .c > div:last-child { border-radius: 4px 4px 0 0; }
  .xaxis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .hbars .row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr 44px; gap: 10px; align-items: center; padding: 4px 0; font-size: 13px; }
  .hbars .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
  .hbars .track { height: 10px; }
  .hbars .fill { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbars .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .inbar { display: flex; align-items: center; gap: 8px; }
  .inbar .fill { height: 8px; background: var(--series-1); border-radius: 0 4px 4px 0; }
  #tip { position: fixed; pointer-events: none; z-index: 50; background: var(--text); color: var(--surface); font-size: 12px;
         padding: 6px 9px; border-radius: 6px; white-space: pre; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.2); }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--surface);
           padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,.25); }

  /* fila em duas colunas: lista + painel do item selecionado */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 36%); gap: 16px; align-items: start; }
  .pane { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  .pane .ph { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .pane .ph h2 { margin: 4px 0 6px; font-size: 16px; line-height: 1.35; letter-spacing: -.01em; }
  .pane .pact { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .pane .pb { padding: 12px 16px 16px; }
  .pane .detail { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 0; }
  .pane .desc { max-height: 320px; }
  .pane-empty { padding: 48px 20px; text-align: center; color: var(--muted); }
  .pr.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .pr.sel.conflict { box-shadow: inset 3px 0 0 var(--bad); }
  .lay2, .lay-side { display: grid; gap: 16px; align-items: start; }
  .lay2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
  .lay-side { grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); }
  .lay2 > .card + .card, .lay-side > .card + .card, .split > .card + .card { margin-top: 0; }
  .relt td { padding: 6px 10px; }
  .relt .env { flex-wrap: nowrap; }
  .relt .nw { white-space: nowrap; }
  .col { min-width: 0; }
  @media (max-width: 1180px) {
    .lay2, .lay-side { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    .pr { grid-template-columns: 18px minmax(0, 1fr); }
    .kpis { grid-template-columns: 1fr 1fr; }
    .toolbar .seg { overflow-x: auto; max-width: 100%; }
    .pr .avatar { display: none; }
    .pr .actions { grid-column: 1 / -1; justify-content: flex-end; }
    .detail { grid-column: 1 / -1; grid-template-columns: 1fr; }
    .grid2 { grid-template-columns: 1fr; }
  }

  /* conflito */
  .pr.conflict { background: color-mix(in srgb, var(--bad-bg) 60%, var(--surface)); box-shadow: inset 4px 0 0 var(--bad); }
  .pr.conflict:hover, .pr.conflict.open { background: color-mix(in srgb, var(--bad-bg) 85%, var(--surface)); }
  .pill.p-conflict { background: var(--bad); color: #fff; }
  .conflict-banner { display: flex; gap: 12px; align-items: center; background: var(--bad-bg); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
                     border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; flex-wrap: wrap; }
  .conflict-banner .ci { font-size: 20px; }
  .conflict-banner .small { color: var(--text-2); }
  .conflict-btn { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .conflict-on { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.kpi { text-align: left; font: inherit; color: inherit; cursor: pointer; }
  button.kpi:hover { border-color: var(--bad); }
  button.kpi.on { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
  .warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-top: 10px; }
  .conflict-box { background: var(--bad-bg); color: var(--bad); margin: 0 0 4px; }

  /* regras */
  .rules-list .rule { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
  .rules-list .rule:first-child { border-top: 0; }
  .rule.off .rbody { opacity: .55; }
  .rbody { cursor: pointer; min-width: 0; }
  .rbody:hover .sentence { color: var(--accent); }
  .rtop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .prio { width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 11px; display: grid;
          place-items: center; color: var(--text-2); font-weight: 600; }
  .rname { font-weight: 650; }
  .act { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; }
  .a-approve { background: var(--good-bg); color: var(--good); }
  .a-archive { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); }
  .a-notify { background: var(--accent-soft); color: var(--accent); }
  .sentence { font-size: 14px; color: var(--text); line-height: 1.5; }
  .sentence b { font-weight: 650; }
  .rstats { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .ractions { display: flex; gap: 4px; align-items: center; }
  .tpl-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 4px; background: var(--warn-bg); color: var(--warn); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 13px; font-weight: 600; }
  .tag .x { border: 0; background: none; padding: 0 6px; color: inherit; font-size: 11px; }

  .tchip { border-radius: 999px; padding: 4px 11px; font-size: 13px; background: var(--surface); }

  .addin { width: 100%; margin-top: 8px; font-size: 13px; }
  input.full { width: 100%; }
  details.more summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-2); }
  .preview { border-bottom: 0 !important; }
  .preview .sentence { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  .simgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .simstat { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  .simstat .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .simstat .l { font-size: 12px; color: var(--text-2); }
  .simlist { margin-top: 10px; border: 1px solid var(--line); border-radius: 9px; max-height: 220px; overflow: auto; }
  .simrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 7px 10px; border-top: 1px solid var(--line); font-size: 13px; }
  .simrow:first-child { border-top: 0; }
  .ell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* deploys */
  .dep-ic { background: var(--surface-2); border: 1px solid var(--line-2); font-size: 16px; }
  .pr.dep-release .dep-ic { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .pr.dep-permission .dep-ic { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .pr.dep-prod { box-shadow: inset 4px 0 0 var(--warn); }
  .kindtag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); flex-shrink: 0; }
  .stage { font-weight: 700; flex-shrink: 0; }

  .sect { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface-2); border-top: 1px solid var(--line);
          font-size: 12px; font-weight: 650; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .card > .sect:first-child { border-top: 0; border-radius: 10px 10px 0 0; }

  .env { display: inline-flex; gap: 4px; flex-wrap: wrap; }

  #updBlock .card { max-width: 480px; }
  .failbox { border: 1px solid color-mix(in srgb, var(--bad) 30%, var(--line)); background: color-mix(in srgb, var(--bad-bg) 40%, var(--surface));
             border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; display: grid; gap: 4px; }
  pre.log { margin: 6px 0 0; max-height: 260px; overflow: auto; font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; background: var(--surface-2);
            border: 1px solid var(--line); border-radius: 6px; padding: 8px; white-space: pre-wrap; word-break: break-word; color: var(--text-2); }
  .st-p-good { background: var(--good-bg); color: var(--good); } .st-p-bad { background: var(--bad-bg); color: var(--bad); }
  .st-p-warn { background: var(--warn-bg); color: var(--warn); }
  .avatar.dep-ic { font-size: 14px; font-weight: 700; }
  .nw { white-space: nowrap; }
  /* ambiente */
  .orgform { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1.3fr) auto; gap: 10px; align-items: end; padding: 14px 16px; border-top: 1px solid var(--line); }
  .orgform:first-of-type { border-top: 0; }
  .orgform label.f { display: grid; gap: 4px; font-size: 12px; color: var(--text-2); font-weight: 600; min-width: 0; }
  .orgform label.f input { width: 100%; }
  .orgform .oact { display: flex; gap: 6px; align-items: center; }
  .orgform .tests { grid-column: 1 / -1; display: grid; gap: 4px; font-size: 13px; }
  .orgform .who { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -4px; }

  .steps-help { margin: 0; padding-left: 18px; line-height: 1.7; }
  @media (max-width: 760px) {
    .orgform { grid-template-columns: 1fr; }

  }
  @media (max-width: 760px) {
    .rules-list .rule { grid-template-columns: auto minmax(0, 1fr); }

<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="logo">PR</span>PR Pilot</div>
    <nav class="nav" id="tabs"></nav>
    <div class="side-foot">
      <label class="switch" title="Pausa só as ações automáticas"><input type="checkbox" id="autoOn"><span class="label-pause" id="autoLabel">Automação</span></label>
      <div class="health" id="health"></div>
      <button class="sm" id="refresh" title="Ler o Azure agora (⌘R recarrega a tela)">↻ Atualizar agora</button>
    </div>
  </aside>
  <main class="content">
    <header class="vhead" id="vhead"></header>
    <div id="errors"></div>
    <section id="view"></section>
  </main>
</div>
<div id="tip"></div>
<div id="modal" hidden></div>
<datalist id="dl-creators"></datalist>
<datalist id="dl-repos"></datalist>

<script>
// O backend só responde a quem tem a chave desta execução — o app injeta window.PR_PILOT_TOKEN.
const _fetch = window.fetch.bind(window);
window.fetch = (u, o = {}) => _fetch(u, {...o, headers: {...(o.headers || {}), "X-PR-Pilot-Token": window.PR_PILOT_TOKEN || ""}});
const VOTES = {10: ["Aprovada", "p-good"], 5: ["Aprovada c/ sugestões", "p-good"], [-5]: ["Aguardando autor", "p-warn"], [-10]: ["Recusada", "p-bad"]};
const POLICY = {approved: ["✓", "p-good"], rejected: ["✗", "p-bad"], broken: ["✗", "p-bad"], running: ["⟳", "p-warn"], queued: ["⟳", "p-warn"], notApplicable: ["–", "p-neutral"]};
const ORG_COLORS = ["var(--org-1)", "var(--org-2)", "var(--org-3)"];
const AVATAR_COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#6250d6", "#e34948", "#008300", "#c98500", "#d55181"];

let S = null;              // estado do servidor
const [hashTab, hashRule] = location.hash.slice(1).split("/");
const TAB_IDS = ["fila", "minhas", "todas", "builds", "releases", "arquivadas", "auto", "analise", "historico", "ambiente"];
let tab = TAB_IDS.includes(hashTab) ? hashTab : "fila";
let F = {q: "", org: "", creator: "", conflict: false, kind: ""};
let relOnlyProd = false;
let CFG = null, cfgDraft = null, cfgBusy = false;
let focusKey = null;                       // item mostrado no painel lateral (telas largas)
const wide = () => innerWidth >= 1180;
const ICON = {
  fila: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  minhas: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  builds: '<path d="m15 12-8.5 8.5a2.12 2.12 0 1 1-3-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25a2.4 2.4 0 0 1-.7-1.7V7.5L16.5 5h-1.25a2.4 2.4 0 0 1-1.7-.7L12.3 3"/>',
  todas: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/>',
  releases: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
  arquivadas: '<rect x="2" y="4" width="20" height="5" rx="1"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/>',
  auto: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  analise: '<path d="M3 3v18h18"/><path d="M7 16v-4"/><path d="M11 16V8"/><path d="M15 16v-6"/><path d="M19 16V5"/>',
  historico: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  ambiente: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
};
const svg = path => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
const VIEW_HEAD = {
  fila: ["Fila", "Tudo que espera você — PRs, releases e permissões"],
  todas: ["PRs abertas", "Pull requests de outras pessoas, inclusive as que você já votou"],
  minhas: ["Minhas PRs", "O que está travando as suas PRs abertas"],
  builds: ["Builds", "Execuções recentes de pipeline nas suas organizações"],
  releases: ["Releases", "Aprovações de release, ambientes YAML e pipelines pedindo permissão"],
  arquivadas: ["Arquivadas", "Fora da fila — o piloto não age nelas"],
  auto: ["Automação", "Regras que agem sozinhas, avaliadas de cima para baixo"],
  analise: ["Análise", "Como as PRs andam nas suas organizações"],
  historico: ["Histórico", "Tudo que você e o piloto fizeram"],
  ambiente: ["Ambiente", "Organizações e contas do Azure DevOps"],
};
let selected = new Set();
let expanded = new Set();
let A = null, aDays = 30, aOrg = "", aLoading = false;
let histFilter = "all";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = p => `${p.org}|${p.prId}`;
const post = (path, body) => fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-PR-Pilot": "1"}, body: JSON.stringify(body || {})})
  .then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; });
const hoursSince = iso => iso ? (Date.now() - new Date(iso)) / 36e5 : null;
function fmtH(h) {
  if (h === null || h === undefined) return "—";
  if (h < 1) return `${Math.max(1, Math.round(h * 60))} min`;
  if (h < 48) return `${Math.round(h)} h`;
  return `${(h / 24).toFixed(1).replace(".", ",")} d`;
}
const initials = n => (n || "?").split(/[\s.@_-]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
const hash = s => [...(s || "")].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const avatarColor = n => AVATAR_COLORS[hash(n) % AVATAR_COLORS.length];
const orgColor = o => ORG_COLORS[Math.max(0, (S?.orgs || []).indexOf(o)) % ORG_COLORS.length];
const isProtected = t => S.rules.protectedTargets.map(x => x.toLowerCase()).includes((t || "").toLowerCase());
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

async function load() {
  try { const r = await fetch("/api/state"); S = await r.json(); if (!r.ok) throw new Error(S.error); }
  catch (e) { $("#health").innerHTML = `<span><i class="dot" style="background:var(--bad)"></i>${esc(e.message || "servidor fora do ar")}</span>`; return; }
  if (!S.configured && !load.onboarded) { load.onboarded = true; tab = "ambiente"; }
  if (hashRule && ["fila", "todas", "builds", "minhas"].includes(hashTab) && !load.focused) {  // link direto: #builds/<org>|<id>
    load.focused = true; focusKey = decodeURIComponent(location.hash.slice(1).split("/").slice(1).join("/")); expanded.add(focusKey);
  }
  render();
  if (hashRule && !load.opened) {  // link direto: #auto/nova ou #auto/<id da regra>
    load.opened = true;
    const r = S.rules.rules.find(x => x.id === hashRule), dr = (S.rules.deployRules || []).find(x => x.id === hashRule);
    if (dr || hashRule === "nova-release") openDEditor(dr || blankDRule(DTEMPLATES[0].rule), !dr);
    else if (r || hashRule === "nova") openEditor(r || blankRule(), !r);
  }
}

/* ------------------------------------------------------------------ casca */
function render() {
  const pending = S.prs.filter(p => !p.archived && p.myVote === 0);
  const active = S.prs.filter(p => !p.archived);
  const archived = S.prs.filter(p => p.archived);
  const myBlocked = S.myPrs.filter(p => p.blockers.length).length;
  const running = S.builds.filter(b => b.status !== "completed").length;
  const tabs = [["fila", "Fila", pending.length + S.deploys.length, true], ["minhas", "Minhas PRs", myBlocked || S.myPrs.length, myBlocked > 0],
                ["todas", "PRs abertas", active.length], ["builds", "Builds", running || undefined], ["releases", "Releases", S.deploys.length, true],
                ["arquivadas", "Arquivadas", archived.length], "Configurar", ["auto", "Automação"], ["analise", "Análise"], ["historico", "Histórico"], ["ambiente", "Ambiente"]];
  $("#tabs").innerHTML = tabs.map(t => typeof t === "string" ? `<div class="grp">${t}</div>` :
    `<button class="${tab === t[0] ? "on" : ""}" data-tab="${t[0]}">${svg(ICON[t[0]])}<span>${t[1]}</span>${t[2] !== undefined ? `<span class="count ${t[3] && t[2] && tab !== t[0] ? "hot" : ""}">${t[2]}</span>` : ""}</button>`).join("");
  const [vt, vs] = VIEW_HEAD[tab];
  $("#vhead").innerHTML = `<h1>${vt}</h1><span class="sub">${vs}</span>`;

  const ago = S.lastPoll ? new Date(S.lastPoll).toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"}) : "—";
  $("#health").innerHTML = S.orgs.map(o => `<span title="${esc(S.me[o]?.name || "")}${S.errors[o] ? " — erro: " + esc(S.errors[o]) : ""}"><i class="dot" style="background:${S.errors[o] ? "var(--bad)" : orgColor(o)}"></i>${esc(o)}</span>`).join("")
    + `<span class="ago">lido às ${ago}${S.pollMs ? ` · ${(S.pollMs / 1000).toFixed(1)}s` : ""}</span>`;
  const paused = S.rules.settings.paused;
  $("#autoOn").checked = !paused;
  $("#autoLabel").textContent = paused ? "Automação pausada" : "Automação ativa";
  $("#errors").innerHTML = updateBanner() + Object.entries(S.errors).map(([o, e]) => `<div class="error"><b>${esc(o)}:</b> ${esc(e)}</div>`).join("")
    + Object.entries(S.buildErrors || {}).map(([o, e]) => `<div class="error"><b>${esc(o)} · builds:</b> ${esc(e)}</div>`).join("")
    + Object.entries(S.deployErrors || {}).map(([o, e]) => `<div class="error"><b>${esc(o)} · releases:</b> ${esc(e)}</div>`).join("");
  const waitingMe = pending.length + S.deploys.length;
  document.title = waitingMe ? `(${waitingMe}) PR Pilot` : "PR Pilot";

  $("#dl-creators").innerHTML = S.creators.map(c => `<option value="${esc(c)}">`).join("");
  $("#dl-repos").innerHTML = S.repos.map(c => `<option value="${esc(c)}">`).join("");

  ({fila: renderQueue, todas: renderQueue, minhas: renderMine, builds: renderBuilds, releases: renderReleases, arquivadas: renderArchived, auto: renderAuto,
    analise: renderAnalytics, historico: renderHistory, ambiente: renderEnv})[tab]();
}

/* ------------------------------------------------------------------ fila */
function renderQueue() {
  if (document.activeElement && document.activeElement.closest("#view details.menu[open]")) return;
  const all = S.prs.filter(p => !p.archived);
  const base = tab === "fila" ? all.filter(p => p.myVote === 0) : all;
  const q = F.q.trim().toLowerCase();
  const list = base.filter(p => (!F.org || p.org === F.org) && (!F.creator || p.creatorName === F.creator) && (!F.conflict || p.mergeStatus === "conflicts")
    && (!q || `${p.prId} ${p.title} ${p.repo} ${p.creatorName} ${p.source} ${p.target}`.toLowerCase().includes(q)));
  for (const k of [...selected]) if (!list.some(p => key(p) === k)) selected.delete(k);
  const deps = tab === "fila" ? filterDeploys(S.deploys) : [];
  const showPrs = tab !== "fila" || !F.kind || F.kind === "pr";

  const today = new Date().toDateString();
  const todayVotes = S.activity.filter(a => a.action === "vote" && (a.vote === 10 || a.vote === 5) && new Date(a.ts).toDateString() === today);
  const pend = all.filter(p => p.myVote === 0);
  const oldest = pend.reduce((m, p) => !m || p.created < m ? p.created : m, null);
  const relN = S.deploys.filter(d => d.kind !== "permission").length, permN = S.deploys.filter(d => d.kind === "permission").length;
  const kpis = [
    ["PRs aguardando meu voto", pend.length, pend.filter(p => isProtected(p.target)).length ? `${pend.filter(p => isProtected(p.target)).length} para branch protegida` : `${all.length} abertas de outros`, false],
    ["Releases para aprovar", relN, relN ? "esperando liberação" : "nada parado", false],
    ["Permissões pendentes", permN, permN ? "pipeline travado esperando você" : "nenhum pipeline travado", permN > 0],
    ["Aprovadas hoje", todayVotes.length, `${todayVotes.filter(a => a.by === "auto").length} auto · ${todayVotes.filter(a => a.by !== "auto").length} manual`, false],
    ["Mais antiga na fila", oldest ? fmtH(hoursSince(oldest)) : "—", "aguardando meu voto", hoursSince(oldest) > 72],
    ["Com conflito", all.filter(p => p.mergeStatus === "conflicts").length, F.conflict ? "filtrando — clique para limpar" : "clique para ver só elas", all.some(p => p.mergeStatus === "conflicts"), "conflict"],
    ["Build falhou", all.filter(p => p.build === "failed").length, "policy de build", all.some(p => p.build === "failed")],
  ];

  const creators = [...new Set(base.map(p => p.creatorName))].sort();
  const conflicts = base.filter(p => p.mergeStatus === "conflicts");
  $("#view").innerHTML = `
    ${S.rules.settings.paused ? `<div class="notice">⏸ Automação pausada — nada é aprovado sozinho até você religar no menu lateral.</div>` : ""}
    <div class="kpis">${kpis.map(([l, v, s, alert, kf]) => `<${kf ? `button data-kfilter="${kf}"` : "div"} class="kpi ${alert && v ? "alert" : ""} ${kf && F.conflict ? "on" : ""}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></${kf ? "button" : "div"}>`).join("")}</div>
    <div class="toolbar">
      ${tab === "fila" ? `<div class="seg">${[["", "Tudo", pend.length + S.deploys.length], ["pr", "PRs", pend.length], ["release", "Releases", relN], ["permission", "Permissões", permN]]
        .map(([k, l, n]) => `<button class="${F.kind === k ? "on" : ""}" data-kind="${k}">${l} <span class="muted">${n}</span></button>`).join("")}</div>` : ""}
      <input type="search" id="q" placeholder="Buscar por número, título, repositório, pipeline, branch…" value="${esc(F.q)}">
      <div class="seg" id="orgSeg">${["", ...S.orgs].map(o => `<button class="${F.org === o ? "on" : ""}" data-org="${esc(o)}">${o ? esc(o) : "Todas"}</button>`).join("")}</div>
      ${conflicts.length ? `<button class="${F.conflict ? "conflict-on" : "conflict-btn"}" data-kfilter="conflict">⚠ Com conflito (${conflicts.length})</button>` : ""}
      <select id="creatorSel"><option value="">Todos os criadores</option>${creators.map(c => `<option ${F.creator === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
    </div>
    ${conflicts.length && !F.conflict ? `<div class="conflict-banner"><span class="ci">⚠</span><div><b>${conflicts.length} PR(s) com conflito de merge</b>
      <div class="small">${conflicts.map(p => `#${p.prId} ${esc(p.creatorName.split(" ")[0])} → ${esc(p.target)}`).join(" · ")} — o autor precisa resolver antes de completar.</div></div>
      <span class="spacer"></span><button class="sm" data-kfilter="conflict">Ver só elas</button></div>` : ""}
    ${selected.size ? `<div class="bulk"><b>${selected.size} selecionada(s)</b><span class="spacer"></span>
      <button class="approve sm" data-bulk="approve">Aprovar</button>
      <button class="sm" data-bulk="archive">Arquivar</button>
      <button class="ghost sm" data-bulk="clear">Limpar</button></div>` : ""}
    ${(() => { queueOrder = [...deps.map(d => d.key), ...(showPrs ? list.map(key) : [])];
      if (wide() && !queueOrder.includes(focusKey)) focusKey = queueOrder[0] || null; return ""; })()}
    <div class="${wide() ? "split" : ""}"><div class="card">
      ${deps.length ? `<div class="sect">🚀 Releases e permissões <span class="muted" style="font-weight:500">${deps.length}</span></div>` + deps.map(deployRow).join("") : ""}
      ${showPrs && list.length ? (tab === "fila" ? `<div class="sect">Pull requests <span class="muted" style="font-weight:500">${list.length}</span></div>` : "") + `<div class="list-head">
          <input type="checkbox" id="selAll" ${list.every(p => selected.has(key(p))) ? "checked" : ""} title="Selecionar todas">
          <span class="small muted">${list.length} PR(s)${tab === "fila" ? " aguardando seu voto" : " abertas"} · mais novas primeiro</span></div>`
        + list.map(prRow).join("") : ""}
      ${!deps.length && !(showPrs && list.length) ? `<div class="empty"><b>${tab === "fila" ? "Fila zerada 🎉" : "Nenhuma PR aberta"}</b>${q || F.org || F.creator || F.kind ? "Nada bate com os filtros." : tab === "fila" ? "Nenhuma PR, release ou permissão esperando você." : ""}</div>` : ""}
    </div>${wide() ? `<aside class="card pane">${paneHtml(focusKey)}</aside>` : ""}</div>`;
}

let queueOrder = [];
function paneHtml(k) {
  const d = S.deploys.find(x => x.key === k);
  if (d) return deployPane(d);
  const p = S.prs.find(x => key(x) === k);
  if (!p) return `<div class="pane-empty"><b>Nada selecionado</b><br>Clique num item da lista (↑/↓ também navegam).</div>`;
  const btn = (v, label, cls = "") => p.myVote !== v ? `<button class="sm ${cls}" data-vote="${v}" data-k="${k}">${label}</button>` : "";
  return `<div class="ph">
      <div class="small muted"><i class="dot" style="background:${orgColor(p.org)}"></i> ${esc(p.org)} / ${esc(p.repo)} · <span class="prid">#${p.prId}</span></div>
      <h2>${esc(p.title)}</h2>
      <div class="meta"><span class="branch">${esc(p.source)} → <b>${esc(p.target)}</b></span><span>${esc(p.creatorName)} · há ${fmtH(hoursSince(p.created))}</span>${prPills(p).join("")}</div>
      <div class="pact">${btn(10, "Aprovar", "approve")}${btn(5, "Aprovar c/ sugestões")}${btn(-5, "Aguardando autor")}${btn(-10, "Recusar", "reject")}${btn(0, "Remover voto", "ghost")}
        <a class="btn sm" href="${esc(p.url)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir no Azure ↗</a>
        <button class="sm ghost" data-archive="${k}">${p.archived ? "Restaurar" : "Arquivar"}</button></div>
    </div><div class="pb">${prDetail(p)}</div>`;
}

function deployPane(d) {
  const [icon, label] = DKIND[d.kind];
  return `<div class="ph">
      <div class="small muted"><i class="dot" style="background:${orgColor(d.org)}"></i> ${esc(d.org)} · ${icon} ${label}</div>
      <h2>${esc(d.pipeline)}${d.stage ? ` → ${esc(d.stage)}` : ""}</h2>
      <div class="meta">${d.branch ? `<span class="branch"><b>${esc(d.branch)}</b>${d.version ? ` · ${esc(d.version)}` : ""}</span>` : ""}
        <span>esperando há ${fmtH(hoursSince(d.created))}</span>${deployPills(d).join("")}</div>
      <div class="pact"><button class="approve sm" data-dep="approve" data-k="${esc(d.key)}">${d.kind === "permission" ? "Permitir" : "Aprovar"}</button>
        <button class="reject sm" data-dep="reject" data-k="${esc(d.key)}">${d.kind === "permission" ? "Cancelar run" : "Rejeitar"}</button>
        <a class="btn sm" href="${esc(d.url)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir no Azure ↗</a>
        ${d.prUrl ? `<a class="btn sm" href="${esc(d.prUrl)}" target="_blank" rel="noopener" style="text-decoration:none">PR #${d.prNumber} ↗</a>` : ""}
        <button class="sm ghost" data-dmkrule="${esc(d.key)}">+ Regra</button></div>
    </div><div class="pb">${deployDetail(d)}</div>`;
}

function prPills(p) {
  const v = VOTES[p.myVote], rule = p.rule !== null && p.rule !== undefined ? S.rules.rules[p.rule] : null;
  const pills = [];
  if (isProtected(p.target)) pills.push(`<span class="pill p-warn" title="Branch protegida">🔒 ${esc(p.target)}</span>`);
  if (v) pills.push(`<span class="pill ${v[1]}">${v[0]}</span>`);
  if (p.build === "ok") pills.push(`<span class="pill p-good">Build ✓</span>`);
  if (p.build === "failed") pills.push(`<span class="pill p-bad">Build ✗</span>`);
  if (p.build === "running" || p.build === "pending") pills.push(`<span class="pill p-warn">Build ⟳</span>`);
  if (p.mergeStatus === "conflicts") pills.unshift(`<span class="pill p-conflict">⚠ Conflito de merge</span>`);
  if (p.approvals) pills.push(`<span class="pill p-neutral" title="${esc(p.reviewers.filter(r => r.vote >= 5).map(r => r.name).join(", "))}">👍 ${p.approvals}</span>`);
  if (p.autoComplete) pills.push(`<span class="pill p-neutral" title="Auto-complete ligado">auto-complete</span>`);
  if (rule) pills.push(`<span class="pill p-auto" title="${esc(rule.name || `Regra ${p.rule + 1}`)}: ${esc(ACTIONS[rule.action].label)}">${rule.action === "approve" ? "⚡ auto" : rule.action === "notify" ? "🔔" : "🗄"}${p.waiting ? ` · aguardando ${p.waiting}` : ""}</span>`);
  return pills;
}

function prRow(p) {
  const k = key(p), pills = prPills(p);

  const voteBtns = `
    ${p.myVote !== 10 ? `<button class="approve sm" data-vote="10" data-k="${k}">Aprovar</button>` : ""}
    ${p.myVote !== -10 ? `<button class="reject sm" data-vote="-10" data-k="${k}">Recusar</button>` : ""}`;
  const open = !wide() && expanded.has(k), sel = wide() && focusKey === k;
  return `<div class="pr ${open ? "open" : ""} ${sel ? "sel" : ""} ${p.mergeStatus === "conflicts" ? "conflict" : ""}" data-row="${k}">
    <input type="checkbox" data-sel="${k}" ${selected.has(k) ? "checked" : ""}>
    <div class="avatar" style="background:${avatarColor(p.creatorName)}" title="${esc(p.creatorName)}">${esc(initials(p.creatorName))}</div>
    <div class="main" data-expand="${k}">
      <div class="t"><span class="prid">#${p.prId}</span><span class="title" title="${esc(p.title)}">${esc(p.title)}</span></div>
      <div class="meta">
        <span><i class="dot" style="background:${orgColor(p.org)}"></i> ${esc(p.org)}</span><span class="sep">/</span><span>${esc(p.repo)}</span>
        <span class="branch">${esc(p.source)} → <b>${esc(p.target)}</b></span>
        <span>${esc(p.creatorName)} · há ${fmtH(hoursSince(p.created))}</span>
        ${pills.join("")}
      </div>
    </div>
    <div class="actions">${voteBtns}
      <details class="menu"><summary title="Mais ações">⋯</summary><div class="items">
        <a href="${esc(p.url)}" target="_blank" rel="noopener">Abrir no Azure ↗</a>
        <hr>
        ${p.myVote !== 5 ? `<button data-vote="5" data-k="${k}">Aprovar com sugestões</button>` : ""}
        ${p.myVote !== -5 ? `<button data-vote="-5" data-k="${k}">Aguardando o autor</button>` : ""}
        ${p.myVote !== 0 ? `<button data-vote="0" data-k="${k}">Remover meu voto</button>` : ""}
        <hr>
        <button data-archive="${k}">${p.archived ? "Restaurar para a fila" : "Arquivar (ignorar)"}</button>
        <button data-mkrule="${k}">Regra: auto-aprovar ${esc(p.creatorName.split(" ")[0])} → ${esc(p.target)}</button>
        <button data-mkrule-arch="${k}">Regra: arquivar PRs de ${esc(p.creatorName.split(" ")[0])} → ${esc(p.target)}</button>
      </div></details>
    </div>
    ${open ? prDetail(p) : ""}
  </div>`;
}

function prDetail(p) {
  const reviewers = p.reviewers.length ? p.reviewers.map(r => `<div class="kv"><span>${esc(r.name)}${r.required ? ` <span class="pill p-neutral">obrigatório</span>` : ""}</span>
      <span>${VOTES[r.vote] ? `<span class="pill ${VOTES[r.vote][1]}">${VOTES[r.vote][0]}</span>` : `<span class="muted small">sem voto</span>`}</span></div>`).join("")
    : `<div class="muted small">Sem revisores.</div>`;
  const policies = (p.policies || []).length ? p.policies.map(x => {
      const st = POLICY[x.status] || ["?", "p-neutral"];
      return `<div class="kv"><span>${esc(x.name)}${x.blocking ? "" : ` <span class="muted small">(opcional)</span>`}</span><span class="pill ${st[1]}" title="${esc(x.status)}">${st[0]} ${esc(x.status)}</span></div>`;
    }).join("") : `<div class="muted small">Nenhuma policy avaliada.</div>`;
  return `<div class="detail">
    ${p.mergeStatus === "conflicts" ? `<div class="warnbox conflict-box" style="grid-column:1/-1">⚠ <b>${esc(p.source)}</b> tem conflito com <b>${esc(p.target)}</b>. O merge está bloqueado até o autor (${esc(p.creatorName)}) atualizar a branch — aprovar não resolve.</div>` : ""}
    <div><h4>Descrição</h4><div class="desc">${p.description ? esc(p.description) : `<span class="muted">Sem descrição.</span>`}</div>
      <div class="small muted" style="margin-top:8px">Criada em ${new Date(p.created).toLocaleString("pt-BR")} · merge: ${esc(p.mergeStatus || "—")} · projeto ${esc(p.project)}</div></div>
    <div><h4>Revisores</h4>${reviewers}<h4 style="margin-top:14px">Policies</h4>${policies}</div>
  </div>`;
}

/* ------------------------------------------------------------------ releases / permissões */
const DKIND = {release: ["🚀", "Release"], approval: ["🚀", "Pipeline"], permission: ["🔑", "Permissão"]};
const RES_TYPE = {variablegroup: "grupo de variáveis", endpoint: "service connection", queue: "agent pool", securefile: "arquivo seguro",
                  environment: "ambiente", repository: "repositório"};
const isProdStage = d => /prod/i.test(d.stage || "") || isProtected(d.branch);
const depKind = d => d.kind === "permission" ? "permission" : "release";

function filterDeploys(list) {
  const q = F.q.trim().toLowerCase();
  return list.filter(d => (!F.org || d.org === F.org) && (!F.kind || F.kind === depKind(d)) && !F.conflict && !F.creator
    && (!q || `${d.pipeline} ${d.stage} ${d.branch} ${d.version} ${d.message} ${d.requestedFor} ${d.prNumber || ""} ${d.resources.map(r => r.name).join(" ")}`.toLowerCase().includes(q)));
}

function deployPills(d) {
  const pills = [], prod = isProdStage(d);
  if (d.kind === "permission") pills.push(...d.resources.map(r => `<span class="pill p-warn" title="${esc(RES_TYPE[r.type] || r.type)}">🔑 <span class="res">${esc(r.name)}</span></span>`));
  if (prod) pills.push(`<span class="pill p-warn">🔒 produção</span>`);
  if (!d.mine) pills.push(`<span class="pill p-neutral" title="O Azure não lista você como aprovador deste estágio (nem por grupo). Aprovador: ${esc(d.approver || "outro")}">não é com você · ${esc((d.approver || "outro").replace(/^\[[^\]]+\]\\/, ""))}</span>`);
  if (d.ruleId) pills.push(`<span class="pill p-auto" title="${esc(d.ruleName)}">⚡ auto${d.waiting ? ` · aguardando ${esc(d.waiting)}` : ""}</span>`);
  return pills;
}

function deployRow(d) {
  const [icon, label] = DKIND[d.kind], open = !wide() && expanded.has(d.key), sel = wide() && focusKey === d.key, prod = isProdStage(d), pills = deployPills(d);
  const yes = d.kind === "permission" ? "Permitir" : "Aprovar", no = d.kind === "permission" ? "Cancelar run" : "Rejeitar";
  return `<div class="pr dep-${d.kind === "approval" ? "release" : d.kind} ${prod ? "dep-prod" : ""} ${open ? "open" : ""} ${sel ? "sel" : ""}" data-row="${esc(d.key)}">
    <span></span>
    <div class="avatar dep-ic" title="${label}">${icon}</div>
    <div class="main" data-expand="${esc(d.key)}">
      <div class="t"><span class="kindtag">${label}</span><span class="title" title="${esc(d.pipeline)}">${esc(d.pipeline)}</span>
        ${d.stage ? `<span class="stage">→ ${esc(d.stage)}</span>` : ""}</div>
      <div class="meta">
        <span><i class="dot" style="background:${orgColor(d.org)}"></i> ${esc(d.org)}</span>
        ${d.branch ? `<span class="branch"><b>${esc(d.branch)}</b>${d.version ? ` · ${esc(d.version)}` : ""}</span>` : ""}
        ${d.prNumber ? `<a href="${esc(d.prUrl || "#")}" target="_blank" rel="noopener" class="prid">PR #${d.prNumber}</a>` : d.message ? `<span class="msg" title="${esc(d.message)}">“${esc(d.message)}”</span>` : ""}
        <span>${d.requestedFor ? `${esc(d.requestedFor)} · ` : ""}esperando há ${fmtH(hoursSince(d.created))}</span>
        ${pills.join("")}
      </div>
    </div>
    <div class="actions">
      <button class="approve sm" data-dep="approve" data-k="${esc(d.key)}">${yes}</button>
      ${d.kind !== "permission" ? `<button class="reject sm" data-dep="reject" data-k="${esc(d.key)}">${no}</button>` : ""}
      <details class="menu"><summary title="Mais ações">⋯</summary><div class="items">
        <a href="${esc(d.url)}" target="_blank" rel="noopener">Abrir no Azure ↗</a>
        ${d.prUrl ? `<a href="${esc(d.prUrl)}" target="_blank" rel="noopener">Abrir a PR #${d.prNumber} ↗</a>` : ""}
        ${d.kind === "permission" ? `<hr><button data-dep="reject" data-k="${esc(d.key)}" style="color:var(--bad)">Cancelar esta execução</button>` : ""}
        <hr>
        <button data-dmkrule="${esc(d.key)}">${d.kind === "permission" ? `Regra: sempre liberar ${esc(d.resources.map(r => r.name).join(", "))}` : `Regra: aprovar ${esc(d.pipeline.replace(/ - deploy$/, ""))} → ${esc(d.stage)}`}</button>
      </div></details>
    </div>
    ${open ? deployDetail(d) : ""}
  </div>`;
}

function deployDetail(d) {
  return `<div class="detail"><div>
        <h4>${d.kind === "permission" ? "O que está sendo pedido" : "Release"}</h4>
        ${d.kind === "permission" ? `<div class="desc">O run ${esc(d.version)} de <b>${esc(d.pipeline)}</b> parou no estágio <b>${esc(d.stage)}</b> porque o pipeline ainda não tem permissão para usar:
${d.resources.map(r => `• ${RES_TYPE[r.type] || r.type}: ${r.name}`).join("\n")}

“Permitir” libera esse pipeline para sempre nesses recursos (como o botão Permit do Azure) e o run continua sozinho.</div>`
          : `<div class="kv"><span>Release</span><span>${esc(d.releaseName || d.version || "—")}</span></div>
             <div class="kv"><span>Estágio</span><span>${esc(d.stage || "—")}${d.approvalType ? ` <span class="muted small">(${d.approvalType === "postDeploy" ? "pós-deploy" : "pré-deploy"})</span>` : ""}</span></div>
             <div class="kv"><span>Aprovador</span><span>${esc(d.approver || "—")}${d.mine ? " (você)" : ""}</span></div>
             ${(d.otherApprovers || []).length ? `<div class="kv"><span>Também podem aprovar</span><span>${esc(d.otherApprovers.join(", "))}</span></div>` : ""}`}
      </div><div><h4>Origem</h4>
        <div class="kv"><span>Branch</span><span class="branch"><b>${esc(d.branch || "—")}</b></span></div>
        <div class="kv"><span>Build</span><span>${esc(d.version || "—")}</span></div>
        <div class="kv"><span>Commit</span><span class="small">${esc(d.message || "—")}</span></div>
        <div class="kv"><span>Disparado por</span><span>${esc(d.requestedFor || "—")}</span></div>
      </div></div>`;
}

async function decideDeploy(k, decision, btn) {
  const d = S.deploys.find(x => x.key === k);
  if (!d) return;
  let msg;
  if (d.kind === "permission") msg = decision === "approve"
    ? `Permitir que ${d.pipeline} use ${d.resources.map(r => r.name).join(", ")}?\n\nVale para todas as execuções futuras desse pipeline.`
    : `Cancelar a execução ${d.version} de ${d.pipeline}?`;
  else msg = decision === "approve" ? `Aprovar ${d.pipeline} → ${d.stage}?${isProdStage(d) ? "\n\n⚠ Isto sobe para produção." : ""}` : `Rejeitar ${d.pipeline} → ${d.stage}?`;
  let comment = "";
  if (d.kind !== "permission") { comment = prompt(msg + "\n\nComentário (opcional):", ""); if (comment === null) return; }
  else if (!confirm(msg)) return;
  if (btn) btn.disabled = true;
  try {
    await post("/api/deploy", {key: k, decision, comment});
    toast(d.kind === "permission" ? (decision === "approve" ? "Permissão liberada — o run continua" : "Execução cancelada") : (decision === "approve" ? "Release aprovada" : "Release rejeitada"));
    await load(); setTimeout(load, 5000);
  } catch (e) { alert("Falhou: " + e.message); if (btn) btn.disabled = false; }
}

const ENV_ST = {succeeded: ["✓", "p-good"], partiallySucceeded: ["!", "p-warn"], rejected: ["✗", "p-bad"], canceled: ["⊘", "p-neutral"],
                inProgress: ["⟳", "p-warn"], queued: ["⟳", "p-warn"], scheduled: ["⏱", "p-warn"], notStarted: ["–", "p-neutral"], undefined: ["?", "p-neutral"]};
function renderReleases() {
  if (F.kind === "pr") F.kind = "";
  const deps = filterDeploys(S.deploys);
  const rels = S.releases.filter(r => (!F.org || r.org === F.org) && (!relOnlyProd || isProtected(r.branch)));
  $("#view").innerHTML = `
    <div class="toolbar">
      <div class="seg">${["", ...S.orgs].map(o => `<button class="${F.org === o ? "on" : ""}" data-org="${esc(o)}">${o ? esc(o) : "Todas"}</button>`).join("")}</div>
      <div class="seg">${[["", "Tudo"], ["release", "Releases"], ["permission", "Permissões"]].map(([k, l]) => `<button class="${F.kind === k ? "on" : ""}" data-kind="${k}">${l}</button>`).join("")}</div>
      <span class="spacer"></span><span class="small muted">lido às ${S.lastDeployPoll ? new Date(S.lastDeployPoll).toLocaleTimeString("pt-BR") : "—"}</span>
      <button class="sm" data-goto="auto">⚡ Regras de release</button>
    </div>
    <div class="lay2"><div class="card"><div class="card-h"><h3>Esperando liberação</h3><span class="muted small">${deps.length} item(ns)</span></div>
      ${deps.length ? deps.map(deployRow).join("") : `<div class="empty"><b>Nada parado 🎉</b>Nenhuma release ou pipeline esperando você${F.org || F.kind ? " com esses filtros" : ""}.</div>`}</div>
    <div class="card"><div class="card-h"><h3>Releases recentes</h3><span class="spacer"></span>
      <label class="switch small"><input type="checkbox" id="relProd" ${relOnlyProd ? "checked" : ""}><span>Só de branch protegida (${S.rules.protectedTargets.map(esc).join(", ")})</span></label></div>
      <div class="tbl-wrap"><table class="relt"><thead><tr><th>Release</th><th>Origem</th><th>Estágios</th><th>Criada</th></tr></thead><tbody>
      ${rels.slice(0, 60).map(r => `<tr>
        <td><a href="${esc(r.url)}" target="_blank" rel="noopener" style="text-decoration:none"><b>${esc(r.pipeline.replace(/ - deploy$/, ""))}</b></a>
          <div class="small muted nw"><i class="dot" style="background:${orgColor(r.org)}"></i> ${esc(r.org)} · ${esc(r.name)}</div></td>
        <td class="small nw"><span class="branch">${isProtected(r.branch) ? "🔒 " : ""}<b>${esc(r.branch || "—")}</b></span><div class="muted">${esc(r.version || "")}</div></td>
        <td><span class="env">${r.envs.map(e => { const st = ENV_ST[e.status] || ENV_ST.undefined; return `<span class="pill ${st[1]}" title="${esc(e.status)}">${st[0]} ${esc(e.name)}</span>`; }).join("")}</span></td>
        <td class="small muted nw">${new Date(r.created).toLocaleString("pt-BR", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"})}<div>${esc(r.createdBy.split(" ").slice(0, 2).join(" "))}</div></td></tr>`).join("")
        || `<tr><td colspan="4" class="empty">Nenhuma release.</td></tr>`}
      </tbody></table></div></div></div>`;
}

/* ------------------------------------------------------------------ minhas PRs */
function myPrRow(p) {
  const k = key(p), open = !wide() && expanded.has(k), sel = wide() && focusKey === k;
  const req = p.reviewers.filter(r => r.required), reqOk = req.filter(r => r.vote >= 5).length;
  const pills = [
    ...p.blockers.map(b => `<span class="pill ${b.code === "waiting" ? "p-warn" : "p-bad"}">${b.code === "conflict" ? "⚠ " : ""}${esc(b.label)}</span>`),
    p.isDraft ? `<span class="pill p-neutral">rascunho</span>` : "",
    `<span class="pill ${p.approvals ? "p-good" : "p-neutral"}" title="${esc(p.reviewers.map(r => `${r.name}: ${(VOTES[r.vote] || ["sem voto"])[0]}`).join("\n"))}">👍 ${p.approvals}${req.length ? ` · obrigatórios ${reqOk}/${req.length}` : ""}</span>`,
    p.build === "ok" ? `<span class="pill p-good">Build ✓</span>` : p.build === "running" || p.build === "pending" ? `<span class="pill p-warn">Build ⟳</span>` : "",
    p.autoComplete ? `<span class="pill p-neutral">auto-complete</span>` : "",
  ].filter(Boolean);
  return `<div class="pr ${open ? "open" : ""} ${sel ? "sel" : ""} ${p.mergeStatus === "conflicts" ? "conflict" : ""}" data-row="${k}">
    <span></span>
    <div class="avatar dep-ic" style="background:${p.blockers.length ? "var(--bad-bg)" : "var(--good-bg)"}">${p.blockers.length ? "⛔" : "✓"}</div>
    <div class="main" data-expand="${k}">
      <div class="t"><span class="prid">#${p.prId}</span><span class="title" title="${esc(p.title)}">${esc(p.title)}</span></div>
      <div class="meta"><span><i class="dot" style="background:${orgColor(p.org)}"></i> ${esc(p.org)}</span><span class="sep">/</span><span>${esc(p.repo)}</span>
        <span class="branch">${esc(p.source)} → <b>${esc(p.target)}</b></span><span>aberta há ${fmtH(hoursSince(p.created))}</span>${pills.join("")}</div>
    </div>
    <div class="actions"><a class="btn sm" href="${esc(p.url)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir ↗</a></div>
    ${open ? prDetail(p) : ""}
  </div>`;
}

function renderMine() {
  const q = F.q.trim().toLowerCase();
  const list = S.myPrs.filter(p => (!F.org || p.org === F.org) && (!q || `${p.prId} ${p.title} ${p.repo} ${p.source} ${p.target}`.toLowerCase().includes(q)));
  queueOrder = list.map(key);
  if (wide() && !queueOrder.includes(focusKey)) focusKey = queueOrder[0] || null;
  const blocked = list.filter(p => p.blockers.length);
  const p = S.myPrs.find(x => key(x) === focusKey);
  $("#view").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="l">Abertas</div><div class="v">${S.myPrs.length}</div><div class="s">${S.myPrs.filter(x => x.isDraft).length} rascunho(s)</div></div>
      <div class="kpi ${blocked.length ? "alert" : ""}"><div class="l">Travadas</div><div class="v">${blocked.length}</div><div class="s">conflito, build ou voto contra</div></div>
      <div class="kpi"><div class="l">Sem nenhuma aprovação</div><div class="v">${S.myPrs.filter(x => !x.approvals && !x.isDraft).length}</div><div class="s">esperando revisor</div></div>
      <div class="kpi"><div class="l">Mais antiga</div><div class="v">${S.myPrs.length ? fmtH(Math.max(...S.myPrs.map(x => hoursSince(x.created)))) : "—"}</div><div class="s">aberta há</div></div>
    </div>
    <div class="toolbar"><input type="search" id="q" placeholder="Buscar nas minhas PRs…" value="${esc(F.q)}">
      <div class="seg">${["", ...S.orgs].map(o => `<button class="${F.org === o ? "on" : ""}" data-org="${esc(o)}">${o ? esc(o) : "Todas"}</button>`).join("")}</div></div>
    <div class="${wide() ? "split" : ""}"><div class="card">
      ${list.length ? list.map(myPrRow).join("") : `<div class="empty"><b>Nenhuma PR sua aberta</b>${q || F.org ? "Nada bate com os filtros." : "Quando você abrir uma, ela aparece aqui com o que estiver travando."}</div>`}
    </div>${wide() ? `<aside class="card pane">${p ? `<div class="ph">
        <div class="small muted"><i class="dot" style="background:${orgColor(p.org)}"></i> ${esc(p.org)} / ${esc(p.repo)} · <span class="prid">#${p.prId}</span></div>
        <h2>${esc(p.title)}</h2>
        <div class="meta"><span class="branch">${esc(p.source)} → <b>${esc(p.target)}</b></span>${p.blockers.map(b => `<span class="pill p-bad">${esc(b.label)}</span>`).join("")}</div>
        <div class="pact"><a class="btn sm" href="${esc(p.url)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir no Azure ↗</a></div>
      </div><div class="pb">${prDetail(p)}</div>` : `<div class="pane-empty">Selecione uma PR.</div>`}</aside>` : ""}</div>`;
}

/* ------------------------------------------------------------------ builds */
const BST = b => b.status === "inProgress" ? ["⟳", "p-warn", "rodando"] : b.status === "notStarted" ? ["⏱", "p-neutral", "na fila"]
  : b.status === "cancelling" ? ["⊘", "p-neutral", "cancelando"] : ({succeeded: ["✓", "p-good", "sucesso"], failed: ["✗", "p-bad", "falhou"],
    partiallySucceeded: ["!", "p-warn", "parcial"], canceled: ["⊘", "p-neutral", "cancelado"]})[b.result] || ["?", "p-neutral", b.result || b.status];
const REASON = {individualCI: "CI", batchedCI: "CI", pullRequest: "PR", manual: "manual", schedule: "agendado", resourceTrigger: "gatilho", buildCompletion: "gatilho"};
let BF = {status: "", prot: false, mine: false}, buildDetail = {};
function fmtDur(a, b) {
  if (!a) return "—";
  return fmtMs((b ? new Date(b) : Date.now()) - new Date(a));
}
function fmtMs(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s` : `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min`;
}
const branchLabel = b => b.branch.startsWith("refs/pull/") ? `PR #${b.prNumber}` : b.branch;
const waitingOn = b => S.deploys.find(d => d.buildId === b.id && d.org === b.org);

function filterBuilds() {
  const q = F.q.trim().toLowerCase(), myIds = Object.values(S.me).map(m => m?.id);
  return S.builds.filter(b => (!F.org || b.org === F.org)
    && (!BF.status || (BF.status === "running" ? b.status !== "completed" : BF.status === "failed" ? ["failed", "partiallySucceeded"].includes(b.result) : b.result === "succeeded"))
    && (!BF.prot || isProtected(b.branch)) && (!BF.mine || myIds.includes(b.requestedForId))
    && (!q || `${b.pipeline} ${b.number} ${b.branch} ${b.message} ${b.requestedFor} ${b.prNumber || ""}`.toLowerCase().includes(q)));
}

function buildRow(b) {
  const [ic, cls, label] = BST(b), open = !wide() && expanded.has(b.key), sel = wide() && focusKey === b.key, w = waitingOn(b);
  return `<div class="pr brow ${open ? "open" : ""} ${sel ? "sel" : ""}" data-row="${esc(b.key)}">
    <span></span>
    <div class="avatar dep-ic st-${cls}" title="${esc(label)}">${ic}</div>
    <div class="main" data-expand="${esc(b.key)}">
      <div class="t"><span class="title">${esc(b.pipeline)}</span><span class="prid">${esc(b.number)}</span></div>
      <div class="meta">
        <span><i class="dot" style="background:${orgColor(b.org)}"></i> ${esc(b.org)}</span>
        <span class="branch">${isProtected(b.branch) ? "🔒 " : ""}<b>${esc(branchLabel(b))}</b></span>
        <span class="pill p-neutral">${esc(REASON[b.reason] || b.reason)}</span>
        ${b.message ? `<span class="msg" title="${esc(b.message)}">${esc(b.message)}</span>` : ""}
        <span>${esc(b.requestedFor.split(" ").slice(0, 2).join(" "))} · há ${fmtH(hoursSince(b.queued))}</span>
        ${w ? `<span class="pill p-warn">${w.kind === "permission" ? "🔑 esperando permissão" : "🚀 esperando aprovação"}</span>` : ""}
      </div>
    </div>
    <div class="actions"><span class="pill ${cls}">${ic} ${esc(label)}</span><span class="small muted nw" style="min-width:74px;text-align:right">${fmtDur(b.started, b.finished)}</span></div>
    ${open ? `<div class="detail" style="grid-column:1/-1">${buildDetailHtml(b)}</div>` : ""}
  </div>`;
}

function loadBuildDetail(b) {
  const ck = `${b.key}|${b.status}|${b.result}`;
  if (buildDetail[b.key]?.ck === ck) return;
  buildDetail[b.key] = {ck, loading: true};
  fetch(`/api/build?key=${encodeURIComponent(b.key)}`).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; })
    .then(j => { buildDetail[b.key] = {ck, data: j}; }).catch(e => { buildDetail[b.key] = {ck, error: e.message}; })
    .finally(() => { if (tab === "builds") renderBuilds(); });
}

function buildDetailHtml(b) {
  loadBuildDetail(b);
  const d = buildDetail[b.key], w = waitingOn(b);
  const acts = `<div class="pact">
      ${["failed", "partiallySucceeded", "canceled"].includes(b.result) ? `<button class="sm primary" data-bact="retry" data-k="${esc(b.key)}" title="Reexecuta só o que falhou, no mesmo run">↻ Tentar de novo</button>` : ""}
      ${b.status === "completed" ? `<button class="sm" data-bact="rerun" data-k="${esc(b.key)}" title="Novo run do mesmo commit">▶ Rodar de novo</button>` : ""}
      ${b.status !== "completed" ? `<button class="sm reject" data-bact="cancel" data-k="${esc(b.key)}">Cancelar</button>` : ""}
      ${w ? `<button class="sm" data-gofila="${esc(w.key)}">${w.kind === "permission" ? "🔑 Ver permissão" : "🚀 Ver aprovação"}</button>` : ""}
      <a class="btn sm" href="${esc(b.url)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir no Azure ↗</a></div>`;
  const kv = `<div class="kv"><span>Branch</span><span class="branch"><b>${esc(b.branch)}</b></span></div>
    <div class="kv"><span>Commit</span><span class="small">${esc(b.message || (b.sourceVersion || "").slice(0, 8) || "—")}</span></div>
    <div class="kv"><span>Disparado por</span><span>${esc(b.requestedFor)} <span class="muted small">(${esc(REASON[b.reason] || b.reason)})</span></span></div>
    <div class="kv"><span>Na fila / início / fim</span><span class="small">${[b.queued, b.started, b.finished].map(t => t ? new Date(t).toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"}) : "—").join(" · ")}</span></div>
    <div class="kv"><span>Duração</span><span>${fmtDur(b.started, b.finished)}</span></div>`;
  let body = `<div class="muted small">Carregando etapas…</div>`;
  if (d?.error) body = `<div class="error">${esc(d.error)}</div>`;
  else if (d?.data) {
    const st = d.data.stages.map(x => { const c = x.result === "succeeded" ? "p-good" : x.result === "failed" ? "p-bad" : x.state === "inProgress" ? "p-warn" : "p-neutral";
      return `<span class="pill ${c}">${esc(x.name)}</span>`; }).join(" ");
    body = `${st ? `<h4>Etapas</h4><div class="env" style="flex-wrap:wrap">${st}</div>` : ""}
      ${d.data.failed.length ? `<h4 style="margin-top:14px">Onde falhou</h4>${d.data.failed.map(f => `<div class="failbox"><b>${esc(f.name)}</b> <span class="muted small">${esc(f.type)}</span>
        ${f.issues.map(i => `<div class="small" style="color:${i.type === "error" ? "var(--bad)" : "var(--warn)"}">${esc(i.message)}</div>`).join("")}
        ${f.logTail ? `<details><summary class="small">últimas linhas do log</summary><pre class="log">${esc(f.logTail)}</pre></details>` : ""}</div>`).join("")}` : ""}`;
  }
  return `${wide() ? "" : acts}<div>${kv}</div><div>${body}</div>`.replace(/^/, wide() ? "" : "");
}

function renderBuilds() {
  if (document.activeElement && document.activeElement.closest("#view details[open]")) return;
  const list = filterBuilds();
  queueOrder = list.map(b => b.key);
  if (wide() && !queueOrder.includes(focusKey)) focusKey = queueOrder[0] || null;
  const day = S.builds.filter(b => hoursSince(b.queued) <= 24), done = day.filter(b => b.status === "completed" && b.result !== "canceled");
  const failedDay = day.filter(b => b.result === "failed");
  const durations = S.builds.filter(b => b.result === "succeeded" && b.started && b.finished).map(b => new Date(b.finished) - new Date(b.started)).sort((a, b) => a - b);
  const med = durations.length ? durations[Math.floor(durations.length / 2)] : null;
  const b = S.builds.find(x => x.key === focusKey);
  $("#view").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="l">Rodando agora</div><div class="v">${S.builds.filter(x => x.status !== "completed").length}</div><div class="s">${S.builds.filter(x => x.status === "notStarted").length} na fila</div></div>
      <div class="kpi ${failedDay.length ? "alert" : ""}"><div class="l">Falharam (24 h)</div><div class="v">${failedDay.length}</div><div class="s">${failedDay.filter(x => isProtected(x.branch)).length} em branch protegida</div></div>
      <div class="kpi"><div class="l">Sucesso (24 h)</div><div class="v">${done.length ? Math.round(100 * done.filter(x => x.result === "succeeded").length / done.length) + "%" : "—"}</div><div class="s">${done.length} concluídos</div></div>
      <div class="kpi"><div class="l">Duração mediana</div><div class="v">${med ? fmtMs(med) : "—"}</div><div class="s">builds com sucesso</div></div>
      <div class="kpi"><div class="l">Esperando você</div><div class="v">${S.builds.filter(waitingOn).length}</div><div class="s">permissão ou aprovação</div></div>
    </div>
    <div class="toolbar">
      <div class="seg">${[["", "Todos"], ["running", "Rodando"], ["failed", "Falharam"], ["ok", "Sucesso"]].map(([k, l]) => `<button class="${BF.status === k ? "on" : ""}" data-bstatus="${k}">${l}</button>`).join("")}</div>
      <input type="search" id="q" placeholder="Buscar pipeline, branch, PR, commit, pessoa…" value="${esc(F.q)}">
      <div class="seg">${["", ...S.orgs].map(o => `<button class="${F.org === o ? "on" : ""}" data-org="${esc(o)}">${o ? esc(o) : "Todas"}</button>`).join("")}</div>
      <button class="sm ${BF.prot ? "primary" : ""}" data-btoggle="prot">🔒 Só protegidas</button>
      <button class="sm ${BF.mine ? "primary" : ""}" data-btoggle="mine">Só os meus</button>
    </div>
    <div class="${wide() ? "split" : ""}"><div class="card">
      ${list.length ? `<div class="list-head"><span class="small muted">${list.length} de ${S.builds.length} execuções recentes · mais novas primeiro</span></div>` + list.map(buildRow).join("")
        : `<div class="empty"><b>Nenhum build</b>Nada bate com os filtros.</div>`}
    </div>${wide() ? `<aside class="card pane">${b ? (() => { const [ic, cls, label] = BST(b); return `<div class="ph">
        <div class="small muted"><i class="dot" style="background:${orgColor(b.org)}"></i> ${esc(b.org)}${b.folder ? ` · ${esc(b.folder)}` : ""} · <span class="pill ${cls}">${ic} ${esc(label)}</span></div>
        <h2>${esc(b.pipeline)} <span class="prid">${esc(b.number)}</span></h2>
        <div class="pact">
          ${["failed", "partiallySucceeded", "canceled"].includes(b.result) ? `<button class="sm primary" data-bact="retry" data-k="${esc(b.key)}" title="Reexecuta só o que falhou, no mesmo run">↻ Tentar de novo</button>` : ""}
          ${b.status === "completed" ? `<button class="sm" data-bact="rerun" data-k="${esc(b.key)}" title="Novo run do mesmo commit">▶ Rodar de novo</button>` : ""}
          ${b.status !== "completed" ? `<button class="sm reject" data-bact="cancel" data-k="${esc(b.key)}">Cancelar</button>` : ""}
          ${waitingOn(b) ? `<button class="sm" data-gofila="${esc(waitingOn(b).key)}">${waitingOn(b).kind === "permission" ? "🔑 Ver permissão" : "🚀 Ver aprovação"}</button>` : ""}
          <a class="btn sm" href="${esc(b.url)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir no Azure ↗</a>
          ${b.prNumber ? `<button class="sm ghost" data-gopr="${esc(b.org)}|${b.prNumber}">PR #${b.prNumber}</button>` : ""}</div>
      </div><div class="pb"><div class="detail">${buildDetailHtml(b).replace(/^<div class="pact">[\s\S]*?<\/div>/, "")}</div></div>`; })()
      : `<div class="pane-empty">Selecione um build.</div>`}</aside>` : ""}</div>`;
}

async function buildAction(k, action, btn) {
  const b = S.builds.find(x => x.key === k);
  if (!b) return;
  const msg = {retry: `Tentar de novo os jobs que falharam em ${b.pipeline} ${b.number}?`, rerun: `Rodar ${b.pipeline} de novo no mesmo commit (${b.branch})?`,
               cancel: `Cancelar ${b.pipeline} ${b.number}?`}[action];
  if (!confirm(msg + (isProtected(b.branch) && action !== "cancel" ? "\n\n⚠ Branch protegida — pode disparar deploy em produção." : ""))) return;
  if (btn) btn.disabled = true;
  try { await post("/api/build-action", {key: k, action}); toast({retry: "Reexecutando o que falhou", rerun: "Novo run na fila", cancel: "Cancelando"}[action]); await post("/api/refresh"); setTimeout(load, 4000); }
  catch (e) { alert("Falhou: " + e.message); if (btn) btn.disabled = false; }
}

/* ------------------------------------------------------------------ atualização do app */
// O backend consulta o latest.json e baixa o instalador conferindo o SHA-256; a troca fica com o app nativo.
const native = msg => (window.webkit?.messageHandlers?.prpilot?.postMessage(msg)) ?? window.chrome?.webview?.postMessage(msg);
let updBusy = false;
function updateBanner() {
  const u = S.update || {};
  if (!u.available) return "";
  const txt = `<b>PR Pilot ${esc(u.version)}</b> (build ${u.build}) disponível${u.notes ? ` — ${esc(u.notes)}` : ""}`;
  const btn = `<button class="primary sm" data-update ${updBusy ? "disabled" : ""}>${updBusy ? "Baixando…" : "Atualizar agora"}</button>`;
  if (u.required) return `<div id="updBlock"><div class="card"><div class="card-b" style="text-align:center;padding:28px">
      <div style="font-size:30px">⬆️</div><h2 style="margin:8px 0">Atualização obrigatória</h2>
      <p class="muted">${txt}. Esta versão (${esc(S.app.version)}) não é mais suportada.</p>${btn}</div></div></div>`;
  return `<div class="notice" style="background:var(--accent-soft);color:var(--text)">⬆️ <span>${txt}</span><span class="spacer"></span>${btn}</div>`;
}
async function runUpdate() {
  updBusy = true; render();
  try {
    const r = await post("/api/update/download");
    toast("Instalando a versão nova — o PR Pilot reabre sozinho");
    native({type: "install", path: r.path});
  } catch (e) { alert("Não atualizou: " + e.message); }
  updBusy = false; render();
}
window.checkUpdate = async manual => {
  try {
    const u = await post("/api/update/check");
    if (manual) toast(u.disabled ? "Atualização automática só no app instalado" : u.available ? `Versão ${u.version} disponível` : u.error ? "Não consegui consultar agora" : "Você está na versão mais nova");
    await load();
  } catch (e) { if (manual) alert(e.message); }
};

/* abre um item vindo de notificação do app: "aba/chave" */
window.openTarget = target => {
  const [t, ...rest] = (target || "").split("/"), k = rest.join("/");
  if (TAB_IDS.includes(t)) tab = t;
  if (k) { focusKey = k; expanded.add(k); }
  history.replaceState(null, "", "#" + tab);
  load();
};

/* ------------------------------------------------------------------ arquivadas */

        <td class="small">${esc(a.creatorName)} → <b>${esc(a.target)}</b></td>
